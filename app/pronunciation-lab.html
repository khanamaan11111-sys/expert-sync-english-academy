<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expert Sync Pronunciation Lab</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:30px 18px;text-align:center;border-radius:0 0 28px 28px}.wrap{max-width:850px;margin:auto;padding:16px}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{margin:8px 0;font-size:29px}.search{display:flex;gap:8px;margin-top:14px}.search input{flex:1;padding:13px;border:0;border-radius:11px}.card{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 16px rgba(3,27,63,.06)}.word{font-size:38px;font-weight:900;color:#063b91}.ipa{font-size:16px;color:#68768b}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#edf4fd;color:#063b91;font-size:10px;font-weight:900;margin:3px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.row{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:11px;color:#68768b}.note{padding:12px;border-radius:12px;background:#fff8df;border:1px solid #eadca7;font-size:12px;line-height:1.55}@media(max-width:600px){.search{flex-direction:column}}@media print{.search,.row,footer{display:none}.card{box-shadow:none}}</style></head><body><header class="hero"><div class="wrap" style="padding:0"><div class="eyebrow">STAGE 37 • EXPERT SYNC ENGLISH ACADEMY</div><h1>🔊 Pronunciation Lab</h1><p>Listen, repeat and practice vocabulary pronunciation using your device's speech engine.</p><div class="search"><input id="q" placeholder="Enter a vocabulary word..." onkeydown="if(event.key==='Enter')loadWord()"><button class="btn gold" onclick="loadWord()">Load Word</button></div></div></header><main class="wrap"><div id="content"></div><div class="card"><div class="row"><button class="btn light" onclick="location.href='pronunciation-progress.html'">📊 Progress</button><button class="btn light" onclick="location.href='dictionary-search.html'">🔎 Dictionary</button><button class="btn light" onclick="location.href='dictionary-pro.html'">📖 Rich Entry</button><button class="btn light" onclick="location.href='vocabulary-trainer.html'">📚 Trainer</button><button class="btn light" onclick="location.href='vocabulary-profile.html'">👤 Profile</button></div></div></main><footer style="text-align:center;padding:25px;color:#6b778b;font-size:11px">© 2026 Expert Sync English Academy</footer><script src="vocabulary-schema.js"></script><script>const E=window.ESAVocabularyEntries||[];function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function recordPractice(w){const k="esaPronunciationPracticeV1";let p={};try{p=JSON.parse(localStorage.getItem(k)||"{}")}catch(e){}p[w]={count:(p[w]?.count||0)+1,last:new Date().toISOString()};localStorage.setItem(k,JSON.stringify(p))}function speak(w,rate=.82){if(!("speechSynthesis"in window)){alert("Speech is not supported on this device/browser.");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=rate;speechSynthesis.speak(u);recordPractice(w)}function loadWord(){const q=document.getElementById("q").value.trim().toLowerCase();const e=E.find(x=>x.w.toLowerCase()===q)||E.find(x=>x.w.toLowerCase().includes(q));if(!e){document.getElementById("content").innerHTML='<div class="card note">Word not found. Search the Dictionary first and choose a word from the vocabulary bank.</div>';return}render(e)}function render(e){document.getElementById("content").innerHTML='<div class="card"><div class="word">'+esc(e.w)+'</div><div class="ipa">'+(e.ipa?'/'+esc(e.ipa)+'/':'IPA: editorial pronunciation field pending completion')+'</div><div><span class="tag">'+esc(e.level)+'</span><span class="tag">'+esc(e.category)+'</span></div><div class="row" style="margin-top:15px"><button class="btn gold" onclick="speak('+JSON.stringify(e.w)+',.75)">🔊 Slow</button><button class="btn" onclick="speak('+JSON.stringify(e.w)+',.95)">▶ Normal</button><button class="btn light" onclick="speak('+JSON.stringify(e.w)+',1.15)">⚡ Fast</button></div><div class="note" style="margin-top:15px"><strong>Practice method:</strong> Listen 2 times → say the word aloud 3 times → use it in one sentence → return to the Rich Entry for meaning and usage. Browser speech is a practice aid; it is not a phonetic accuracy assessment.</div><h3 style="color:#063b91">Meaning</h3><p style="font-size:16px;font-weight:700">'+esc(e.meaning)+'</p><div class="note"><strong>Roman Hinglish:</strong><br>'+esc(e.hinglish)+'</div></div>'}if(E[0]){document.getElementById("q").value=E[0].w;render(E[0])}</script></body></html>
