<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031b3f"><title>Expert Sync Vocabulary Progress</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:28px 18px;border-radius:0 0 26px 26px;text-align:center}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{margin:8px 0;font-size:27px}.hero p{color:#dce9f7;font-size:13px}.wrap{max-width:850px;margin:auto;padding:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff;border:1px solid #dbe5f2;border-radius:16px;padding:17px;text-align:center;box-shadow:0 5px 16px rgba(3,27,63,.06)}.num{font-size:26px;font-weight:900;color:#063b91}.lab{font-size:11px;color:#68768b;margin-top:4px}.card{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 5px 16px rgba(3,27,63,.06)}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.word{font-size:20px;font-weight:900;color:#063b91}.meta{font-size:11px;color:#68768b;margin-top:4px}.review{margin-top:10px;padding:10px;border-radius:10px;background:#f7faff;font-size:12px;line-height:1.5}.progress{height:10px;background:#e4eaf3;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;background:linear-gradient(90deg,#063b91,#d4af37)}.empty{text-align:center;padding:35px;color:#68768b}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.grid .stat:last-child{grid-column:1/-1}}@media print{.bar,footer{display:none}.card,.stat{box-shadow:none}}</style></head><body>
<header class="hero"><div class="eyebrow">STAGE 18 • EXPERT SYNC ENGLISH ACADEMY</div><h1>📊 My Vocabulary Progress</h1><p>Turn dictionary reading into a measurable learning habit.</p></header>
<main class="wrap"><div class="grid" id="stats"></div><div class="card"><div class="bar"><button class="btn" onclick="location.href='vocabulary-trainer.html'">📚 Practise Words</button><button class="btn gold" onclick="review()">🔁 Review Session</button><button class="btn light" onclick="window.print()">📥 Save Progress PDF</button><button class="btn light" onclick="location.href='vocabulary-sync.html'">☁ Sync & Backup</button><button class="btn light" onclick="resetProgress()">Reset</button></div><div class="progress"><div class="fill" id="fill"></div></div><div class="meta" id="rate"></div></div><section id="list"></section></main><footer style="text-align:center;padding:25px;color:#6b778b;font-size:11px">© 2026 Expert Sync English Academy</footer>
<script>
const KEY="esaVocabularyProgressV1";let reviewMode=false;
function get(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
function render(){const p=get(), keys=Object.keys(p),known=keys.filter(k=>p[k].status==="known"),practice=keys.filter(k=>p[k].status==="practice");document.getElementById("stats").innerHTML='<div class="stat"><div class="num">'+keys.length+'</div><div class="lab">Reviewed</div></div><div class="stat"><div class="num">'+known.length+'</div><div class="lab">Known</div></div><div class="stat"><div class="num">'+practice.length+'</div><div class="lab">Need Practice</div></div>';const pct=keys.length?Math.round(known.length/keys.length*100):0;document.getElementById("fill").style.width=pct+"%";document.getElementById("rate").textContent=keys.length?("Mastery among reviewed words: "+pct+"%"):"Start by reviewing words in Vocabulary Trainer.";let arr=reviewMode?practice:keys;document.getElementById("list").innerHTML=arr.length?arr.map(w=>'<article class="card"><div class="word">'+esc(w)+'</div><div class="meta">'+(p[w].status==="known"?"✓ Known":"↻ Needs practice")+' • Reviewed '+(p[w].reviewCount||1)+' time(s)</div><div class="review">Last reviewed: '+new Date(p[w].updatedAt).toLocaleString()+'</div></article>').join(""):'<div class="card empty">'+(reviewMode?"Great — no words are currently marked for practice.":"No progress yet. Open Vocabulary Trainer and mark words as Known or Need Practice.")+'</div>'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function review(){reviewMode=!reviewMode;render()}
function resetProgress(){if(confirm("Reset all vocabulary progress on this device?")){localStorage.removeItem(KEY);reviewMode=false;render()}}
render();
</script></body></html>
