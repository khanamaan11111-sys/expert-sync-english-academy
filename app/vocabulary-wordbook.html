<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expert Sync Personal Wordbook</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:28px 18px;text-align:center;border-radius:0 0 28px 28px}.wrap{max-width:900px;margin:auto;padding:16px}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{margin:8px 0;font-size:29px}.card{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 5px 16px rgba(3,27,63,.06)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.word{border:1px solid #dbe5f2;border-radius:14px;padding:14px}.word h3{margin:0;color:#063b91}.small{font-size:11px;color:#68768b}.tag{display:inline-block;padding:4px 7px;border-radius:99px;background:#edf4fd;color:#063b91;font-size:9px;font-weight:900;margin:3px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.row{display:flex;gap:8px;flex-wrap:wrap}.empty{text-align:center;color:#68768b;padding:30px}@media(max-width:650px){.grid{grid-template-columns:1fr}}@media print{.row,footer{display:none}.card{box-shadow:none}}</style></head><body><header class="hero"><div class="eyebrow">STAGE 35 • EXPERT SYNC ENGLISH ACADEMY</div><h1>⭐ My Personal Wordbook</h1><p>Save useful words, track their learning status and send them back into practice.</p></header><main class="wrap"><div class="card"><div class="row"><button class="btn gold" onclick="location.href='dictionary-search.html'">🔎 Find Words</button><button class="btn light" onclick="location.href='vocabulary-review.html'">🧠 Review Saved</button><button class="btn light" onclick="location.href='vocabulary-profile.html'">👤 Profile</button><button class="btn light" onclick="window.print()">📥 Save Wordbook</button></div></div><div class="grid" id="words"></div></main><footer style="text-align:center;padding:25px;color:#6b778b;font-size:11px">© 2026 Expert Sync English Academy</footer><script src="vocabulary-schema.js"></script><script>const KEY="esaDictionarySavedV1",P="esaVocabularyProgressV1",E=window.ESAVocabularyEntries||[];function get(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function remove(w){localStorage.setItem(KEY,JSON.stringify(get(KEY,[]).filter(x=>x!==w)));render()}function openWord(w){location.href="dictionary-pro.html?word="+encodeURIComponent(w)}function render(){const saved=get(KEY,[]),p=get(P,{}),a=saved.map(w=>E.find(x=>x.w===w)).filter(Boolean);document.getElementById("words").innerHTML=a.length?a.map(x=>'<article class="word"><h3>'+esc(x.w)+'</h3><span class="tag">'+esc(x.level)+'</span><span class="tag">'+esc(x.category)+'</span><p style="font-size:12px">'+esc(x.meaning)+'</p><div class="small">Status: '+esc(p[x.w]?.status||"Not reviewed")+'</div><div class="row" style="margin-top:10px"><button class="btn light" onclick="openWord('+JSON.stringify(x.w)+')">Open</button><button class="btn light" onclick="remove('+JSON.stringify(x.w)+')">Remove</button></div></article>').join(""):'<div class="card empty" style="grid-column:1/-1">Your wordbook is empty. Save words from Dictionary Pro or Dictionary Search.</div>'}render()</script></body></html>
