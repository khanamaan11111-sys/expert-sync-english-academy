<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031b3f"><title>Expert Sync Vocabulary Mastery</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:30px 18px;border-radius:0 0 28px 28px;text-align:center}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{margin:8px 0;font-size:29px}.hero p{max-width:700px;margin:auto;color:#dce9f7;font-size:13px;line-height:1.55}.wrap{max-width:900px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.card{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:17px;box-shadow:0 5px 16px rgba(3,27,63,.06)}.stat{text-align:center}.num{font-size:27px;font-weight:900;color:#063b91}.lab{font-size:10px;color:#68768b;margin-top:5px}.card{margin-top:12px}.section-title{color:#063b91;margin:0 0 8px}.bar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.progress{height:12px;background:#e5eaf2;border-radius:99px;overflow:hidden;margin:10px 0}.fill{height:100%;background:linear-gradient(90deg,#063b91,#d4af37);width:0}.meter{margin:12px 0}.meter-head{display:flex;justify-content:space-between;font-size:12px;font-weight:800}.word{font-size:19px;font-weight:900;color:#063b91}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #edf1f6;padding:10px 0}.row:last-child{border-bottom:0}.small{font-size:11px;color:#68768b}.badge{padding:5px 8px;border-radius:99px;background:#eef4ff;color:#063b91;font-size:10px;font-weight:900}.empty{text-align:center;color:#68768b;padding:25px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr}.hero h1{font-size:24px}}@media print{.bar,footer{display:none}.card,.stat{box-shadow:none}}</style></head><body>
<header class="hero"><div class="eyebrow">STAGE 21 • EXPERT SYNC ENGLISH ACADEMY</div><h1>🏆 Vocabulary Mastery Dashboard</h1><p>Your learning cockpit: mastery, review accuracy, daily consistency and the words that need attention.</p></header>
<main class="wrap">
<div class="grid" id="stats"></div>
<div class="card"><h3 class="section-title">Overall Mastery</h3><div class="progress"><div class="fill" id="masteryFill"></div></div><div class="small" id="masteryText"></div></div>
<div class="card"><h3 class="section-title">Learning Metrics</h3><div id="meters"></div></div>
<div class="card"><h3 class="section-title">Words to Review</h3><div id="due"></div></div>
<div class="card"><h3 class="section-title">Recent Activity</h3><div id="recent"></div></div>
<div class="card"><div class="bar"><button class="btn gold" onclick="location.href='vocabulary-review.html'">🧠 Start Smart Review</button><button class="btn gold" onclick="location.href='vocabulary-challenge.html'">🏁 Challenge</button><button class="btn gold" onclick="location.href='vocabulary-daily.html'">🎯 Daily Mission</button><button class="btn light" onclick="location.href='vocabulary-achievements.html'">🏅 Achievements</button><button class="btn light" onclick="location.href='vocabulary-paths.html'">🧭 Learning Paths</button><button class="btn light" onclick="location.href='vocabulary-trainer.html'">📚 Vocabulary Trainer</button><button class="btn light" onclick="location.href='vocabulary-progress.html'">📊 Detailed Progress</button><button class="btn light" onclick="location.href='vocabulary-sync.html'">☁ Sync & Backup</button><button class="btn light" onclick="window.print()">📥 Save Dashboard PDF</button></div></div>
</main><footer style="text-align:center;padding:25px;color:#6b778b;font-size:11px">© 2026 Expert Sync English Academy</footer>
<script>
const KEY="esaVocabularyProgressV1";
function get(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
function day(s){return new Date(s+"T00:00:00")}
function isoDay(d){return d.toISOString().slice(0,10)}
function streak(p){const days=new Set(Object.values(p).filter(x=>x.lastReviewed).map(x=>isoDay(new Date(x.lastReviewed))));let d=new Date();let count=0;while(days.has(isoDay(d))){count++;d.setDate(d.getDate()-1)}return count}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){const p=get(),keys=Object.keys(p),known=keys.filter(w=>p[w].status==="known").length,practice=keys.filter(w=>p[w].status==="practice").length,totalAttempts=keys.reduce((n,w)=>n+(p[w].attempts||0),0),correct=keys.reduce((n,w)=>n+(p[w].correct||0),0),accuracy=totalAttempts?Math.round(correct/totalAttempts*100):0,mastery=keys?Math.round(known/keys.length*100):0,today=isoDay(new Date()),due=keys.filter(w=>p[w].status==="practice"&&(!p[w].nextReview||p[w].nextReview<=today));document.getElementById("stats").innerHTML='<div class="stat"><div class="num">'+keys.length+'</div><div class="lab">Words Reviewed</div></div><div class="stat"><div class="num">'+known+'</div><div class="lab">Mastered</div></div><div class="stat"><div class="num">'+due.length+'</div><div class="lab">Due Today</div></div><div class="stat"><div class="num">🔥 '+streak(p)+'</div><div class="lab">Day Streak</div></div>';document.getElementById("masteryFill").style.width=mastery+"%";document.getElementById("masteryText").textContent=keys.length?mastery+"% of reviewed words are currently marked Known. Keep moving the words from Practice → Known.":"No vocabulary has been reviewed yet.";document.getElementById("meters").innerHTML=meter("Recall accuracy",accuracy)+meter("Mastery",mastery)+meter("Review coverage",Math.min(100,Math.round(keys.length/30*100)));document.getElementById("due").innerHTML=due.length?due.slice(0,8).map(w=>'<div class="row"><div><div class="word">'+esc(w)+'</div><div class="small">Next review: '+esc(p[w].nextReview||"today")+'</div></div><span class="badge">PRACTICE</span></div>').join(""):'<div class="empty">🎉 No practice words are due today.</div>';const recent=keys.sort((a,b)=>new Date(p[b].lastReviewed||0)-new Date(p[a].lastReviewed||0)).slice(0,8);document.getElementById("recent").innerHTML=recent.length?recent.map(w=>'<div class="row"><div><div class="word">'+esc(w)+'</div><div class="small">'+(p[w].status==="known"?"✓ Known":"↻ Needs practice")+' • '+(p[w].attempts||0)+' attempts</div></div><span class="badge">'+(p[w].correct||0)+' correct</span></div>').join(""):'<div class="empty">Your recent activity will appear here after your first review.</div>'}
function meter(label,value){return '<div class="meter"><div class="meter-head"><span>'+label+'</span><span>'+value+'%</span></div><div class="progress"><div class="fill" style="width:'+value+'%"></div></div></div>'}
render();
</script></body></html>
