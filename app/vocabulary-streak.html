<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expert Sync Vocabulary Streaks</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:30px 18px;text-align:center;border-radius:0 0 28px 28px}.wrap{max-width:900px;margin:auto;padding:16px}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{margin:8px 0;font-size:29px}.card{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 16px rgba(3,27,63,.06)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center;background:#f8fbff;border:1px solid #e1e8f2;border-radius:14px;padding:15px}.num{font-size:29px;font-weight:900;color:#063b91}.small{font-size:11px;color:#68768b;line-height:1.55}.day{display:inline-block;width:36px;height:36px;line-height:36px;text-align:center;border-radius:50%;margin:4px;background:#edf4fd;color:#063b91;font-size:11px;font-weight:900}.active{background:#063b91;color:#fff}.today{outline:3px solid #d4af37}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.row{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="hero"><div class="eyebrow">STAGE 46 • EXPERT SYNC ENGLISH ACADEMY</div><h1>🔥 Vocabulary Learning Streak</h1><p>Build consistency with a simple, transparent record of active vocabulary-learning days.</p></header><main class="wrap"><div class="grid" id="stats"></div><div class="card"><h3 style="color:#063b91">📅 Last 28 Days</h3><div id="calendar"></div></div><div class="card"><h3 style="color:#063b91">🎯 Consistency Guidance</h3><div id="guidance" class="small"></div></div><div class="card"><div class="row"><button class="btn gold" onclick="markToday()">✓ Mark Today's Learning</button><button class="btn light" onclick="location.href='vocabulary-goals.html'">🎯 Goals</button><button class="btn light" onclick="location.href='vocabulary-daily.html'">🎯 Daily Mission</button><button class="btn light" onclick="location.href='vocabulary-weekly-report.html'">📊 Weekly Review</button><button class="btn light" onclick="location.href='vocabulary-profile.html'">👤 Profile</button></div></div></main><footer style="text-align:center;padding:25px;color:#6b778b;font-size:11px">© 2026 Expert Sync English Academy</footer><script>const KEY="esaVocabularyLearningDaysV1";function get(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return []}}function day(d){return new Date(d).toISOString().slice(0,10)}function markToday(){const a=get(),t=day(new Date());if(!a.includes(t))a.push(t);localStorage.setItem(KEY,JSON.stringify(a.sort()));render()}function render(){const a=get(),set=new Set(a),now=new Date(),today=day(now);let streak=0;for(let d=new Date(now);set.has(day(d));d.setDate(d.getDate()-1))streak++;let best=0,run=0,prev=null;for(const s of a){const d=new Date(s+"T00:00:00");if(prev&&((d-prev)/86400000)===1)run++;else run=1;best=Math.max(best,run);prev=d}const last7=[...Array(7)].map((_,i)=>{const d=new Date(now);d.setDate(d.getDate()-i);return day(d)}).filter(x=>set.has(x)).length;document.getElementById("stats").innerHTML='<div class="stat"><div class="num">'+streak+'</div><div class="small">Current Streak (days)</div></div><div class="stat"><div class="num">'+best+'</div><div class="small">Best Streak</div></div><div class="stat"><div class="num">'+last7+'</div><div class="small">Active Days / 7</div></div>';const labels=["S","M","T","W","T","F","S"];document.getElementById("calendar").innerHTML=[...Array(28)].map((_,i)=>{const d=new Date(now);d.setDate(d.getDate()-(27-i));const s=day(d);return '<span class="day '+(set.has(s)?"active ":"")+(s===today?"today":"")+'" title="'+s+'">'+labels[d.getDay()]+'</span>'}).join("");document.getElementById("guidance").textContent=streak>=7?"Excellent consistency. Protect the habit, but prioritize meaningful practice over simply extending the streak.":streak>=3?"Good momentum. A short daily session is enough to build consistency.":"Start with one focused vocabulary activity today. The streak records activity days; it does not measure language proficiency."}render()</script></body></html>
