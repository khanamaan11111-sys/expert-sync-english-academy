<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031b3f"><title>Expert Sync Vocabulary Trainer</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:28px 18px;border-radius:0 0 26px 26px;text-align:center}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{margin:8px 0;font-size:27px}.hero p{max-width:650px;margin:auto;color:#dbe8f7;font-size:13px;line-height:1.55}.wrap{max-width:850px;margin:auto;padding:15px}.bar,.card{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 5px 16px rgba(3,27,63,.07)}.bar{position:sticky;top:8px;z-index:4}input{width:100%;padding:13px;border:1px solid #cbd7e7;border-radius:11px;font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.stats{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.pill{padding:7px 10px;border:1px solid #dbe5f2;background:#fff;border-radius:99px;font-size:11px;font-weight:800}.word{font-size:27px;font-weight:900;color:#063b91}.meta{font-size:11px;color:#6c7890;margin-top:3px}.meaning{margin-top:14px;line-height:1.55}.label{font-size:9px;color:#b88600;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-top:13px}.text{font-size:13px;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{text-align:center;color:#69768b;padding:35px}@media(max-width:600px){.grid{grid-template-columns:1fr}.hero h1{font-size:23px}}@media print{.bar,.row,footer{display:none}.card{box-shadow:none;break-inside:avoid}}
</style></head><body>
<header class="hero"><div class="eyebrow">STAGE 17 • EXPERT SYNC ENGLISH ACADEMY</div><h1>📚 Vocabulary Trainer</h1><p>Search, review and practise the words you need for everyday English, interviews, customer service and aviation communication.</p></header>
<main class="wrap"><div class="bar"><input id="q" placeholder="Search a word, meaning or Hinglish explanation…" oninput="render()"><div class="row"><button class="btn" onclick="randomWord()">🎯 Random Word</button><button class="btn gold" onclick="window.print()">📥 Save as PDF</button><button class="btn light" onclick="location.href='dictionary.html'">← Dictionary Pro</button><button class="btn light" onclick="location.href='index.html'">← Student App</button></div></div><div class="stats" id="stats"></div><section id="out"></section></main><footer style="text-align:center;padding:25px;color:#6b778b;font-size:11px">© 2026 Expert Sync English Academy</footer>
<script>
const words=[
["assist","verb","/əˈsɪst/","help someone","Help someone to do something.","Kisi ki help karna.","Please assist the passenger with the form.","assist a customer • assist a passenger"],
["confirm","verb","/kənˈfɜːm/","to say or show that something is true or correct","To check and say that something is correct.","Kisi cheez ko check karke sure karna.","Please confirm your booking details.","confirm a booking • confirm details"],
["complaint","noun","/kəmˈpleɪnt/","a statement that something is wrong or unsatisfactory","A customer statement about a problem.","Customer ki problem ya dissatisfaction ki statement.","The agent handled the complaint calmly.","handle a complaint • receive a complaint"],
["courteous","adjective","/ˈkɜːtiəs/","polite and respectful","Polite and respectful.","Respectful aur polite.","The staff were courteous to every passenger.","courteous service • courteous manner"],
["efficient","adjective","/ɪˈfɪʃənt/","working well without wasting time or resources","Working well and quickly without unnecessary waste.","Kam time aur resources mein achhe se kaam karna.","She is efficient at handling customer requests.","efficient service • efficient process"],
["escalate","verb","/ˈeskəleɪt/","to pass a problem to a higher level for further action","Send a serious issue to someone with more authority.","Serious problem ko higher level par bhejna.","I will escalate the issue to my supervisor.","escalate an issue • escalate a complaint"],
["fluent","adjective","/ˈfluːənt/","able to speak or write a language easily and smoothly","Able to communicate smoothly.","Language ko smoothly bol pana.","She is becoming more fluent in English.","fluent English • fluent speaker"],
["genuine","adjective","/ˈdʒenjuɪn/","real, sincere, or not false","Real and sincere.","Asli aur sincere.","He showed genuine concern for the passenger.","genuine concern • genuine interest"],
["handle","verb","/ˈhændəl/","to deal with a person, task, or situation","To deal with something successfully.","Kisi situation ya person ko manage karna.","She handled the difficult customer professionally.","handle a complaint • handle pressure"],
["maintain","verb","/meɪnˈteɪn/","to keep something at the same level or in good condition","To keep something working or continuing well.","Kisi cheez ko achhi condition ya level par rakhna.","Maintain eye contact during the interview.","maintain standards • maintain quality"],
["negotiate","verb","/nɪˈɡəʊʃieɪt/","to discuss something to reach an agreement","Discuss to find an agreement.","Baat-cheet karke agreement tak pahunchna.","We negotiated a practical solution.","negotiate a solution • negotiate an agreement"],
["priority","noun","/praɪˈɒrəti/","something that is more important than other things","Something that must be dealt with first.","Jo kaam sabse important ho aur pehle karna ho.","Passenger safety is our top priority.","top priority • give priority to"],
["punctual","adjective","/ˈpʌŋktʃuəl/","arriving or happening at the expected time","On time.","Time par hona.","A punctual employee is dependable.","punctual employee • punctual arrival"],
["respond","verb","/rɪˈspɒnd/","to react or reply to something","To reply or react.","Kisi baat ka reply ya reaction dena.","Please respond to the customer's question clearly.","respond to a request • respond quickly"],
["responsible","adjective","/rɪˈspɒnsəbəl/","having a duty to deal with something and being reliable about it","Reliable and trusted with a duty.","Kisi duty ki responsibility lena aur reliable rehna.","I am responsible for checking the daily report.","responsible for • responsible employee"],
["schedule","noun/verb","/ˈʃedjuːl/","a plan showing when things are expected to happen","A planned timetable.","Planned timetable ya time plan.","The flight schedule changed this morning.","flight schedule • work schedule"],
["solution","noun","/səˈluːʃən/","an answer to a problem","A way to solve a problem.","Problem ka practical answer.","We need a quick solution for the passenger.","find a solution • practical solution"],
["sufficient","adjective","/səˈfɪʃənt/","enough for a particular purpose","Enough for what is needed.","Jitna required ho, utna enough.","We have sufficient time to complete the check.","sufficient time • sufficient information"],
["temporary","adjective","/ˈtempərəri/","lasting for only a limited period","Not permanent.","Sirf limited time ke liye.","The counter is temporarily closed.","temporary solution • temporary change"],
["verify","verb","/ˈverɪfaɪ/","to check that something is true, accurate, or valid","To check carefully.","Carefully check karke sure karna.","Please verify the passenger's identification.","verify information • verify details"],
["attitude","noun","/ˈætɪtjuːd/","the way you think or feel about something","Your way of thinking or behaving toward something.","Kisi situation ya person ke towards aapka mindset ya behaviour.","A positive attitude helps at work.","positive attitude • professional attitude"],
["cooperate","verb","/kəʊˈɒpəreɪt/","to work together to achieve something","Work together.","Milkar kaam karna.","The team cooperated during the busy shift.","cooperate with • cooperate fully"],
["courtesy","noun","/ˈkɜːtəsi/","polite behaviour that shows respect","Polite and respectful behaviour.","Respect dikhane wala polite behaviour.","The company thanked the passenger as a courtesy.","as a courtesy • professional courtesy"],
["departure","noun","/dɪˈpɑːtʃə/","the act or time of leaving a place","The act or time of leaving.","Kisi jagah se nikalne ka act ya time.","Please arrive before departure.","departure time • departure gate"],
["destination","noun","/ˌdestɪˈneɪʃən/","the place someone is travelling to","The place you are going to.","Jahan aap travel karke jaana chahte hain.","Delhi is our final destination.","final destination • reach a destination"],
["emergency","noun","/ɪˈmɜːdʒənsi/","a serious unexpected situation requiring immediate action","A serious situation needing quick action.","Achanak serious situation jismein turant action zaroori ho.","Follow the crew during an emergency.","emergency procedure • emergency exit"],
["reliable","adjective","/rɪˈlaɪəbəl/","able to be trusted to work well or behave as expected","Someone or something you can trust.","Jis par bharosa kiya ja sake.","A reliable employee completes tasks on time.","reliable service • reliable employee"],
["professional","adjective","/prəˈfeʃənəl/","showing the skills and behaviour expected in a job","Skilled and suitable for the workplace.","Workplace ke liye skilled aur proper behaviour wala.","She gave a professional response.","professional communication • professional attitude"],
["confident","adjective","/ˈkɒnfɪdənt/","feeling sure about your abilities or decisions","Feeling sure of yourself.","Apni ability par bharosa hona.","He sounded confident in the interview.","confident speaker • feel confident"],
["resolve","verb","/rɪˈzɒlv/","to solve a problem successfully","To solve a problem.","Problem ko solve karna.","The agent resolved the complaint politely.","resolve an issue • resolve a complaint"],
["feedback","noun","/ˈfiːdbæk/","comments about performance that help improvement","Information about what went well and what to improve.","Kya achha hua aur kya improve karna hai, uski comments.","The trainer gave useful feedback.","give feedback • constructive feedback"]
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){const q=(document.getElementById("q").value||"").toLowerCase().trim();const a=words.filter(x=>!q||x.join(" ").toLowerCase().includes(q));document.getElementById("stats").innerHTML='<span class="pill">'+a.length+' matching words</span><span class="pill">'+words.length+' Stage 17 words</span><span class="pill">Roman Hinglish</span><span class="pill">Career English</span>';document.getElementById("out").innerHTML=a.length?a.map(card).join(""):'<div class="card empty">No matching word found. Try another search.</div>'}
function card(x){return '<article class="card"><div class="word">'+esc(x[0])+'</div><div class="meta">'+esc(x[1])+' • '+esc(x[2])+'</div><div class="grid"><div><div class="label">Meaning</div><div class="text">'+esc(x[3])+'</div></div><div><div class="label">Easy explanation</div><div class="text">'+esc(x[4])+'</div></div><div><div class="label">Roman Hinglish</div><div class="text">'+esc(x[5])+'</div></div><div><div class="label">Example</div><div class="text">'+esc(x[6])+'</div></div><div><div class="label">Collocations</div><div class="text">'+esc(x[7])+'</div></div></div><div class="row"><button class="btn" onclick="say('+JSON.stringify(x[0])+')">🔊 Hear word</button></div></article>'}
function say(w){if("speechSynthesis"in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(w))}}
function randomWord(){const x=words[Math.floor(Math.random()*words.length)];document.getElementById("q").value=x[0];render();scrollTo({top:0,behavior:"smooth"})}
render();
</script></body></html>
