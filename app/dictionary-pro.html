<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#063b91">
<title>Expert Sync Dictionary Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f8ff;color:#172033}
.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:24px 16px 28px;border-radius:0 0 28px 28px;box-shadow:0 8px 25px rgba(3,27,63,.18)}
.wrap{max-width:940px;margin:auto;padding:16px}
.eyebrow{color:#ffd978;font-size:11px;font-weight:900;letter-spacing:2px}
.hero h1{margin:7px 0 5px;font-size:30px}.hero p{margin:0 0 16px;color:#dceaff;font-size:13px}
.search{display:grid;grid-template-columns:1fr auto;gap:8px}.search input{width:100%;padding:13px 14px;border:0;border-radius:12px;font-size:15px;outline:none}
.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#ffd54a;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.danger{background:#fff0f0;color:#a51e1e;border:1px solid #f0c5c5}
.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.toolbar select{padding:11px;border:1px solid #ccd8e8;border-radius:11px;background:#fff;color:#172033}
.card{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 16px rgba(3,27,63,.06)}
.word-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.word{font-size:38px;color:#063b91;font-weight:900;line-height:1.1}.ipa{font-size:14px;color:#68768b;margin-top:5px}
.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#edf4fd;color:#063b91;font-size:10px;font-weight:900;margin:3px 3px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section{line-height:1.55;font-size:13px}.section h3{color:#063b91;margin:0 0 8px}.section ul{margin:7px 0;padding-left:20px}
.definition{font-size:18px;font-weight:750}.hinglish{background:#fff8df;border:1px solid #eadca7;border-radius:12px;padding:12px;margin-top:12px}
.context{background:#f8fbff;border:1px solid #e1e8f2;border-radius:12px;padding:12px;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.small{font-size:11px;color:#68768b}.empty{text-align:center;padding:32px;color:#68768b}
.results{display:grid;gap:8px}.result-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border:1px solid #dbe5f2;border-radius:13px;background:#fff}.result-item b{color:#063b91}.result-item small{display:block;color:#68768b;margin-top:3px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi div{background:#061d3f;color:#fff;border-radius:13px;padding:12px;text-align:center}.kpi strong{display:block;color:#ffd54a;font-size:20px}.kpi span{font-size:10px;color:#dceaff}
.status{font-size:11px;font-weight:800;color:#68768b}
@media(max-width:650px){.search{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.word{font-size:31px}.word-head{display:block}.result-item{align-items:flex-start}.kpi{grid-template-columns:1fr 1fr 1fr}}
@media print{.hero,.toolbar,.results,.actions,.stats,footer{display:none!important}.card{box-shadow:none;border:0}.wrap{max-width:none}}
</style>
</head>
<body>
<header class="hero">
<div class="wrap" style="padding:0">
<div class="eyebrow">STAGE 34 • EXPERT SYNC ENGLISH ACADEMY</div>
<h1>📖 Dictionary Pro — Learning Intelligence</h1>
<p>Search, study, save and practise vocabulary with English-first explanations and Roman Hinglish support.</p>
<div class="search">
<input id="search" autocomplete="off" placeholder="Search a word, e.g. accurate" oninput="liveSearch()" onkeydown="if(event.key==='Enter')findWord()">
<button class="btn gold" onclick="findWord()">Search</button>
</div>
</div>
</header>

<main class="wrap">
<section class="card">
<div class="toolbar">
<select id="levelFilter" onchange="applyFilters()"><option value="">All levels</option><option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option></select>
<select id="categoryFilter" onchange="applyFilters()"><option value="">All contexts</option><option value="aviation">Aviation</option><option value="customer-service">Customer Service</option><option value="interview">Interview</option><option value="speaking">Speaking</option><option value="workplace">Workplace</option></select>
<select id="statusFilter" onchange="applyFilters()"><option value="">All learning status</option><option value="known">Known</option><option value="practice">Need Practice</option><option value="saved">Saved</option></select>
</div>
<div id="results" class="results" style="margin-top:10px"></div>
</section>

<section id="content"></section>

<section class="card stats">
<div class="kpi">
<div><strong id="totalCount">0</strong><span>Words in bank</span></div>
<div><strong id="savedCount">0</strong><span>Saved words</span></div>
<div><strong id="practiceCount">0</strong><span>Need practice</span></div>
</div>
</section>

<section class="card actions">
<div class="row">
<button class="btn light" onclick="location.href='dictionary-search.html'">🔎 Advanced Search</button>
<button class="btn light" onclick="location.href='pronunciation-lab.html'">🔊 Pronunciation</button>
<button class="btn light" onclick="location.href='vocabulary-sentence-builder.html'">✍️ Sentence Builder</button>
<button class="btn light" onclick="location.href='vocabulary-wordbook.html'">⭐ Wordbook</button>
<button class="btn light" onclick="location.href='vocabulary-hub.html'">🧭 Discovery Hub</button>
<button class="btn light" onclick="location.href='vocabulary-trainer.html'">📚 Trainer</button>
<button class="btn light" onclick="location.href='vocabulary-daily.html'">🎯 Daily Mission</button>
<button class="btn light" onclick="location.href='vocabulary-review.html'">🧠 Smart Review</button>
<button class="btn light" onclick="window.print()">📥 Print Entry</button>
</div>
</section>
</main>

<footer style="text-align:center;padding:25px;color:#6b778b;font-size:11px">© 2026 Expert Sync English Academy • Dictionary Pro Stage 34</footer>
<script src="vocabulary-schema.js"></script>
<script>
const KEY="esaVocabularyProgressV1";
const SAVE_KEY="esaDictionarySavedV1";
const entries=window.ESAVocabularyEntries||[];
let current=null;

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function getProg(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
function getSaved(){try{return JSON.parse(localStorage.getItem(SAVE_KEY)||"[]")}catch(e){return []}}
function saveState(k,v){localStorage.setItem(k,JSON.stringify(v))}
function wordObj(word){return entries.find(x=>x.w.toLowerCase()===String(word).toLowerCase())}
function setStatus(word,status){const p=getProg();p[word]={...(p[word]||{}),status,lastReviewed:new Date().toISOString()};saveState(KEY,p);render(wordObj(word));updateStats()}
function toggleSave(word){let a=getSaved();a=a.includes(word)?a.filter(x=>x!==word):[word,...a];saveState(SAVE_KEY,a.slice(0,200));render(wordObj(word));applyFilters();updateStats()}
function speak(word){if(!("speechSynthesis" in window)){alert("Speech is not supported on this device.");return}speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(word))}
function copyWord(word){navigator.clipboard?.writeText(word).then(()=>alert("Word copied: "+word)).catch(()=>alert(word))}
function findWord(){const q=document.getElementById("search").value.trim().toLowerCase();if(!q){render(null);return}const exact=wordObj(q);const e=exact||entries.find(x=>x.w.toLowerCase().startsWith(q))||entries.find(x=>x.w.toLowerCase().includes(q));if(e){current=e;render(e);document.getElementById("results").innerHTML=""}else{render(null,"No matching word found. Try another spelling or clear the filters.")}}
function liveSearch(){const q=document.getElementById("search").value.trim().toLowerCase();if(!q){document.getElementById("results").innerHTML="";return}const list=entries.filter(x=>x.w.toLowerCase().includes(q)).slice(0,8);document.getElementById("results").innerHTML=list.map(e=>'<button class="result-item" style="text-align:left" onclick="selectWord('+JSON.stringify(e.w)+')"><span><b>'+esc(e.w)+'</b><small>'+esc(e.level)+' • '+esc(e.category)+'</small></span><span>→</span></button>').join("")}
function selectWord(word){document.getElementById("search").value=word;findWord()}
function list(a){return Array.isArray(a)&&a.length?a.map(x=>"<li>"+esc(x)+"</li>").join(""):'<li class="small">Editorial content pending. We will expand this field only after quality review.</li>'}
function render(e,message){const c=document.getElementById("content");if(!e){c.innerHTML='<div class="card empty">'+esc(message||"Search for a word from the vocabulary bank.")+"</div>";return}current=e;const p=getProg()[e.w]||{};const saved=getSaved().includes(e.w);const contexts=(e.contexts||[]).join(", ");c.innerHTML=
'<article class="card"><div class="word-head"><div><div class="word">'+esc(e.w)+'</div><div class="ipa">'+(e.ipa?"/"+esc(e.ipa)+"/":"Pronunciation field pending editorial completion")+'</div><div><span class="tag">'+esc(e.level)+'</span><span class="tag">'+esc(e.category)+'</span>'+(e.pos?'<span class="tag">'+esc(e.pos)+'</span>':'')+'</div></div><div class="row"><button class="btn light" onclick="speak('+JSON.stringify(e.w)+')">🔊 Hear</button><button class="btn light" onclick="copyWord('+JSON.stringify(e.w)+')">📋 Copy</button></div></div><div class="hinglish"><strong>Easy Roman Hinglish</strong><br>'+esc(e.hinglish)+'</div><div class="section" style="margin-top:15px"><h3>Definition</h3><div class="definition">'+esc(e.meaning)+'</div></div><div class="row" style="margin-top:14px"><button class="btn gold" onclick="setStatus('+JSON.stringify(e.w)+',\'known\')">✓ I Know This</button><button class="btn '+(saved?"danger":"light")+'" onclick="toggleSave('+JSON.stringify(e.w)+')">'+(saved?"★ Saved":"☆ Save Word")+'</button><button class="btn light" onclick="setStatus('+JSON.stringify(e.w)+',\'practice\')">↻ Need Practice</button><span class="status">Status: '+esc(p.status||"Not reviewed")+'</span></div></article>'+
'<div class="grid"><div class="card section"><h3>💬 Examples</h3><ul>'+list(e.examples)+'</ul></div><div class="card section"><h3>🔗 Collocations</h3><ul>'+list(e.collocations)+'</ul></div><div class="card section"><h3>🔄 Synonyms</h3><ul>'+list(e.synonyms)+'</ul></div><div class="card section"><h3>↔️ Antonyms</h3><ul>'+list(e.antonyms)+'</ul></div><div class="card section"><h3>🌳 Word Family</h3><ul>'+list(e.wordFamily)+'</ul></div><div class="card section"><h3>⚠️ Common Mistakes</h3><ul>'+list(e.commonMistakes)+'</ul></div></div>'+
'<div class="card section"><h3>🎯 Real-World Usage</h3><div class="context"><strong>Register:</strong> '+esc(e.register||"neutral")+'<br><strong>Contexts:</strong> '+esc(contexts||"general")+'</div></div>'}
function applyFilters(){const q=document.getElementById("search").value.trim().toLowerCase();const level=document.getElementById("levelFilter").value;const cat=document.getElementById("categoryFilter").value;const status=document.getElementById("statusFilter").value;const p=getProg(),saved=getSaved();let list=entries.filter(e=>(!q||e.w.toLowerCase().includes(q))&&(!level||e.level===level)&&(!cat||(e.contexts||[]).includes(cat))&&(!status||(status==="saved"?saved.includes(e.w):(p[e.w]||{}).status===status))).slice(0,30);document.getElementById("results").innerHTML=list.map(e=>'<button class="result-item" style="text-align:left" onclick="selectWord('+JSON.stringify(e.w)+')"><span><b>'+esc(e.w)+'</b><small>'+esc(e.level)+' • '+esc(e.category)+' • '+esc((p[e.w]||{}).status||"new")+'</small></span><span>→</span></button>').join("")||(q||level||cat||status?'<div class="empty">No words match these filters.</div>':"")}
function updateStats(){const p=getProg(),s=getSaved();document.getElementById("totalCount").textContent=entries.length;document.getElementById("savedCount").textContent=s.length;document.getElementById("practiceCount").textContent=entries.filter(e=>(p[e.w]||{}).status==="practice").length}
updateStats();if(entries.length)render(entries[0]);applyFilters();
</script>
</body>
</html>
