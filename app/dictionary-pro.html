<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expert Sync Dictionary Pro Entry</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:28px 18px;border-radius:0 0 28px 28px}.wrap{max-width:900px;margin:auto;padding:16px}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{margin:8px 0;font-size:30px}.card{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 16px rgba(3,27,63,.06)}.search{display:flex;gap:8px}.search input{flex:1;padding:12px;border:1px solid #cbd7e7;border-radius:11px;font-size:14px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#edf4fd;color:#063b91;font-size:10px;font-weight:900;margin:3px}.word{font-size:35px;color:#063b91;font-weight:900}.ipa{font-size:14px;color:#68768b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section h3{color:#063b91;margin:0 0 8px}.section{line-height:1.55;font-size:13px}.section ul{margin:7px 0;padding-left:20px}.definition{font-size:18px;font-weight:700}.hinglish{background:#fff8df;border:1px solid #eadca7;border-radius:12px;padding:12px;margin-top:10px}.context{background:#f8fbff;border:1px solid #e1e8f2;border-radius:12px;padding:12px;margin-top:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.empty{text-align:center;padding:30px;color:#68768b}.small{font-size:11px;color:#68768b}@media(max-width:650px){.grid{grid-template-columns:1fr}.search{flex-direction:column}.word{font-size:29px}}@media print{.search,.row,footer{display:none}.card{box-shadow:none}}</style></head><body>
<header class="hero"><div class="wrap" style="padding:0"><div class="eyebrow">STAGE 33 • EXPERT SYNC ENGLISH ACADEMY</div><h1>📖 Dictionary Pro — Rich Entry Viewer</h1><div class="search"><input id="search" placeholder="Search a word..." onkeydown="if(event.key==='Enter')findWord()"><button class="btn gold" onclick="findWord()">Search</button></div></div></header>
<main class="wrap"><div class="card"><div class="row"><button class="btn light" onclick="location.href='dictionary-search.html'">🔎 Search Dictionary</button></div></div><div id="content"></div><div class="card"><div class="row"><button class="btn light" onclick="location.href='pronunciation-lab.html'">🔊 Pronunciation</button><button class="btn light" onclick="location.href='vocabulary-wordbook.html'">⭐ Wordbook</button><button class="btn light" onclick="location.href='vocabulary-hub.html'">🧭 Discovery Hub</button><button class="btn light" onclick="location.href='vocabulary-trainer.html'">📚 Trainer</button><button class="btn light" onclick="location.href='vocabulary-daily.html'">🎯 Daily Mission</button><button class="btn light" onclick="location.href='vocabulary-review.html'">🧠 Smart Review</button><button class="btn light" onclick="location.href='vocabulary-profile.html'">👤 Profile</button><button class="btn light" onclick="window.print()">📥 Print Entry</button></div></div></main><footer style="text-align:center;padding:25px;color:#6b778b;font-size:11px">© 2026 Expert Sync English Academy</footer>
<script src="vocabulary-schema.js"></script><script>
const KEY="esaVocabularyProgressV1";const entries=window.ESAVocabularyEntries||[];
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function getProg(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
function saveWord(word){const a=JSON.parse(localStorage.getItem("esaDictionarySavedV1")||"[]");if(!a.includes(word))a.unshift(word);localStorage.setItem("esaDictionarySavedV1",JSON.stringify(a.slice(0,100)));render(entries.find(x=>x.w.toLowerCase()===word.toLowerCase()))}function setStatus(word,status){const p=getProg();p[word]={...(p[word]||{}),status,lastReviewed:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(p));render(entries.find(x=>x.w.toLowerCase()===word.toLowerCase()))}
function findWord(){const q=document.getElementById("search").value.trim().toLowerCase();const e=entries.find(x=>x.w.toLowerCase()===q)||entries.find(x=>x.w.toLowerCase().includes(q));render(e)}
function list(a){return Array.isArray(a)&&a.length?a.map(x=>'<li>'+esc(x)+'</li>').join(""):'<li class="small">Content will be added during dictionary expansion.</li>'}
function render(e){const c=document.getElementById("content");if(!e){c.innerHTML='<div class="card empty">Search for a word from the vocabulary bank.</div>';return}const p=getProg()[e.w]||{};c.innerHTML='<section class="card"><div class="word">'+esc(e.w)+'</div><div class="ipa">'+(e.ipa?'/'+esc(e.ipa)+'/':'Pronunciation field pending editorial completion')+'</div><div style="margin-top:8px"><span class="tag">'+esc(e.level)+'</span><span class="tag">'+esc(e.category)+'</span>'+(e.pos?'<span class="tag">'+esc(e.pos)+'</span>':'')+'</div><div class="hinglish"><strong>Easy Roman Hinglish:</strong><br>'+esc(e.hinglish)+'</div><div class="section" style="margin-top:15px"><h3>Definition</h3><div class="definition">'+esc(e.meaning)+'</div></div><div class="row" style="margin-top:14px"><button class="btn gold" onclick="setStatus('+JSON.stringify(e.w)+',\'known\')">✓ I Know This</button><button class="btn light" onclick="saveWord('+JSON.stringify(e.w)+')">⭐ Save Word</button><button class="btn light" onclick="setStatus('+JSON.stringify(e.w)+',\'practice\')">↻ Need Practice</button><span class="tag">Status: '+esc(p.status||"Not reviewed")+'</span></div></section><div class="grid"><div class="card section"><h3>💬 Examples</h3><ul>'+list(e.examples)+'</ul></div><div class="card section"><h3>🔗 Collocations</h3><ul>'+list(e.collocations)+'</ul></div><div class="card section"><h3>🔄 Synonyms</h3><ul>'+list(e.synonyms)+'</ul></div><div class="card section"><h3>↔️ Antonyms</h3><ul>'+list(e.antonyms)+'</ul></div><div class="card section"><h3>🌳 Word Family</h3><ul>'+list(e.wordFamily)+'</ul></div><div class="card section"><h3>⚠️ Common Mistakes</h3><ul>'+list(e.commonMistakes)+'</ul></div></div><div class="card section"><h3>🎯 Real-World Usage</h3><div class="context"><strong>Register:</strong> '+esc(e.register)+'<br><strong>Context:</strong> '+esc((e.contexts||[]).join(", "))+'</div></div>'}
render(entries[0]);
</script></body></html>
