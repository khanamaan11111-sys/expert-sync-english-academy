<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expert Sync Pronunciation Progress</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:30px 18px;text-align:center;border-radius:0 0 28px 28px}.wrap{max-width:900px;margin:auto;padding:16px}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{margin:8px 0;font-size:29px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.stat{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 5px 16px rgba(3,27,63,.06)}.stat{text-align:center}.num{font-size:27px;font-weight:900;color:#063b91}.small{font-size:11px;color:#68768b}.word{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #edf1f6}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#edf4fd;color:#063b91;font-size:9px;font-weight:900}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.row{display:flex;gap:8px;flex-wrap:wrap}.bar{height:9px;background:#e5eaf2;border-radius:99px;overflow:hidden;margin:7px 0}.fill{height:100%;background:linear-gradient(90deg,#063b91,#d4af37)}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><header class="hero"><div class="eyebrow">STAGE 38 • EXPERT SYNC ENGLISH ACADEMY</div><h1>🎙️ Pronunciation Progress</h1><p>Build a repeatable speaking habit and track which vocabulary words you have practiced aloud.</p></header><main class="wrap"><div class="grid" id="stats"></div><div class="card"><h3 style="color:#063b91">🎯 Practice Recommendation</h3><div id="rec" class="small"></div></div><div class="card"><h3 style="color:#063b91">🗣️ Your Pronunciation Practice List</h3><div id="list"></div></div><div class="card"><div class="row"><button class="btn gold" onclick="location.href='pronunciation-lab.html'">🔊 Pronunciation Lab</button><button class="btn light" onclick="location.href='vocabulary-daily.html'">🎯 Daily Mission</button><button class="btn light" onclick="location.href='dictionary-search.html'">🔎 Dictionary</button><button class="btn light" onclick="location.href='vocabulary-profile.html'">👤 Profile</button></div></div></main><script src="vocabulary-schema.js"></script><script>const E=window.ESAVocabularyEntries||[],KEY="esaPronunciationPracticeV1";function get(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}function save(w){const p=get();p[w]={count:(p[w]?.count||0)+1,last:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(p));render()}function open(w){location.href="pronunciation-lab.html?word="+encodeURIComponent(w)}function render(){const p=get(),rows=Object.entries(p).map(([w,v])=>({e:E.find(x=>x.w===w),...v})).filter(x=>x.e).sort((a,b)=>b.count-a.count),total=Object.values(p).reduce((n,x)=>n+x.count,0),unique=rows.length,active=new Set(rows.map(x=>new Date(x.last).toISOString().slice(0,10))).size;document.getElementById("stats").innerHTML='<div class="stat"><div class="num">'+unique+'</div><div class="small">Words Practiced</div></div><div class="stat"><div class="num">'+total+'</div><div class="small">Practice Sessions</div></div><div class="stat"><div class="num">'+active+'</div><div class="small">Practice Days</div></div><div class="stat"><div class="num">'+(unique?Math.round(total/unique):0)+'</div><div class="small">Avg. Repeats / Word</div></div>';document.getElementById("rec").textContent=unique?"Keep rotating your least-practiced words. A useful routine is 3 aloud repetitions per word, then one original sentence.":"Start in Pronunciation Lab with 5–10 words from today's vocabulary. This tracker records practice sessions only; it does not claim to score pronunciation accuracy.";document.getElementById("list").innerHTML=rows.length?rows.map(x=>'<div class="word"><div><strong>'+x.e.w+'</strong><div class="small">'+x.e.meaning+' • '+x.count+' session'+(x.count===1?'':'s')+'</div><div class="bar"><div class="fill" style="width:'+Math.min(100,x.count/3*100)+'%"></div></div></div><div class="row"><button class="btn light" onclick="open('+JSON.stringify(x.e.w)+')">Practice</button><button class="btn gold" onclick="save('+JSON.stringify(x.e.w)+')">+ Repeat</button></div></div>').join(""):'<div class="small">No pronunciation sessions recorded yet. Open the Pronunciation Lab to begin.</div>'}render()</script></body></html>
