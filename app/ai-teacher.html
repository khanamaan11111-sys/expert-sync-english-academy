<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#063b91">
<title>AI Teacher — Expert Sync English Academy</title>
<style>
:root{--navy:#041b3d;--blue:#063b91;--blue2:#0b63ce;--gold:#d6a900;--ink:#172033;--muted:#68768b;--line:#dce5f0;--bg:#f5f8fc;--white:#fff;--green:#168a45}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
body{display:flex;flex-direction:column;overflow:hidden}.app{width:min(980px,100%);margin:0 auto;height:100%;display:flex;flex-direction:column;background:#fff}
.top{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);z-index:2}
.back{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:#f7faff;color:var(--blue);font-size:20px;cursor:pointer}.brand{min-width:0;flex:1}.brand b{display:block;color:var(--blue);font-size:15px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.status{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:900;color:var(--green);white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.modebar{display:flex;gap:7px;padding:10px 14px;border-bottom:1px solid #edf1f6;overflow:auto;background:#fbfcfe}.mode{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:850;color:#526078;white-space:nowrap;cursor:pointer}.mode.active{background:#edf4fd;border-color:#bfd3ef;color:var(--blue)}
.chat{flex:1;overflow:auto;padding:18px 14px 20px;scroll-behavior:smooth}.welcome{max-width:700px;margin:10px auto 18px}.welcome h1{font-size:26px;color:var(--blue);margin:0 0 7px}.welcome p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 12px;color:var(--blue);font-weight:800;font-size:10px;cursor:pointer}
.msg{display:flex;gap:9px;max-width:760px;margin:0 auto 14px}.msg.user{justify-content:flex-end}.avatar{flex:0 0 30px;width:30px;height:30px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:900}.msg.user .avatar{background:var(--gold);color:var(--navy);order:2}.bubble{max-width:min(78%,680px);padding:11px 13px;border-radius:15px;background:#f5f8fc;border:1px solid #e5ebf3;font-size:13px;line-height:1.55;white-space:pre-wrap}.msg.user .bubble{background:var(--blue);color:#fff;border-color:var(--blue);border-bottom-right-radius:5px}.msg.ai .bubble{border-bottom-left-radius:5px}.bubble .correction{margin-top:10px;padding-top:9px;border-top:1px solid #dce5f0;font-size:11px}.bubble .correction b{color:var(--blue)}.typing{display:inline-flex;gap:4px}.typing i{width:5px;height:5px;border-radius:50%;background:#7f8da2;animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.25;transform:translateY(-2px)}}
.composer{border-top:1px solid var(--line);padding:10px 12px max(10px,env(safe-area-inset-bottom));background:#fff}.tools{display:flex;gap:6px;margin-bottom:7px;overflow:auto}.tool{border:1px solid var(--line);background:#f8fbff;color:#526078;border-radius:10px;padding:6px 8px;font-size:9px;font-weight:850;cursor:pointer;white-space:nowrap}.row{display:flex;gap:8px;align-items:flex-end}.input{flex:1;min-height:46px;max-height:130px;resize:none;border:1px solid #ccd8e8;border-radius:15px;padding:12px 13px;font:inherit;font-size:13px;outline:none}.input:focus{border-color:#7da6d8;box-shadow:0 0 0 3px #edf4fd}.send{width:48px;height:46px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:18px;cursor:pointer}.send:disabled{opacity:.45;cursor:not-allowed}.hint{text-align:center;color:#8793a5;font-size:8px;margin-top:6px}
@media(max-width:600px){.top{padding:9px 10px}.brand b{font-size:14px}.status{font-size:8px}.chat{padding:12px 10px}.welcome h1{font-size:22px}.bubble{max-width:86%;font-size:12px}.chips{display:grid;grid-template-columns:1fr 1fr}.chip{text-align:left}.mode{font-size:9px;padding:7px 10px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><button class="back" onclick="location.href='index.html'" aria-label="Back">‹</button><div class="brand"><b>🤖 Expert Sync AI Teacher</b><small>Your personal English coach</small></div><div class="status"><span class="dot"></span>READY</div></header>
<nav class="modebar" aria-label="Teacher modes">
<button class="mode active" data-mode="teacher">Teacher</button><button class="mode" data-mode="conversation">Conversation</button><button class="mode" data-mode="grammar">Grammar</button><button class="mode" data-mode="vocabulary">Vocabulary</button><button class="mode" data-mode="interview">Interview</button><button class="mode" data-mode="aviation">Aviation</button>
</nav>
<main class="chat" id="chat">
<section class="welcome" id="welcome"><h1>How can I help you learn English?</h1><p>I can explain, correct, practise, role-play, quiz you, and adapt to your level. English first; Roman-script Hinglish only when it helps.</p><div class="chips">
<button class="chip" data-prompt="Correct my English and explain every important mistake.">✍️ Correct my English</button>
<button class="chip" data-prompt="Start a natural English conversation with me.">🗣️ Conversation practice</button>
<button class="chip" data-prompt="Teach me 5 useful vocabulary words with examples and a mini quiz.">📚 Vocabulary lesson</button>
<button class="chip" data-prompt="Give me an English interview question and evaluate my answer.">💼 Interview practice</button>
</div></section>
</main>
<form class="composer" id="composer">
<div class="tools"><button class="tool" type="button" data-prompt="Please correct my English, but keep my original meaning.">Correct</button><button class="tool" type="button" data-prompt="Explain this in simple English and Roman-script Hinglish.">Explain + Hinglish</button><button class="tool" type="button" data-prompt="Ask me one question at a time and wait for my answer.">One question at a time</button><button class="tool" type="button" id="clearBtn">New chat</button></div>
<div class="row"><textarea class="input" id="input" rows="1" placeholder="Message your AI Teacher…"></textarea><button class="send" id="send" type="submit" aria-label="Send">➤</button></div>
<div class="hint">AI Teacher can make mistakes. Verify important information.</div>
</form>
</div>
<script>
const SUPABASE_URL="https://bhxmbbkgkaxikisugrcs.supabase.co";
const SUPABASE_KEY="sb_publishable_RvYvEhsMIFM0mW6M9SHiVw_d2NSlhnz";
const ENDPOINT=SUPABASE_URL+"/functions/v1/ai-teacher";
const chat=document.getElementById("chat"), input=document.getElementById("input"), send=document.getElementById("send"), composer=document.getElementById("composer");
let mode="teacher", history=[];
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function add(role,text,meta){document.getElementById("welcome")?.remove();const m=document.createElement("div");m.className="msg "+role;m.innerHTML='<div class="avatar">'+(role==="ai"?"AI":"You")+'</div><div class="bubble">'+esc(text)+(meta?'<div class="correction">'+meta+"</div>":"")+"</div>";chat.appendChild(m);chat.scrollTop=chat.scrollHeight;return m}
function typing(){const m=document.createElement("div");m.className="msg ai";m.id="typing";m.innerHTML='<div class="avatar">AI</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';chat.appendChild(m);chat.scrollTop=chat.scrollHeight}
function setMode(next){mode=next;document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode===next));input.placeholder=next==="conversation"?"Talk with me naturally…":next==="interview"?"Answer the interview question…":"Message your AI Teacher…";input.focus()}
async function sendMessage(text){text=(text||"").trim();if(!text||send.disabled)return;add("user",text);history.push({role:"user",content:text});input.value="";input.style.height="46px";send.disabled=true;typing();
try{const token=(await fetch(SUPABASE_URL+"/auth/v1/user",{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}})).ok?null:null;
const res=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPABASE_KEY},body:JSON.stringify({message:text,mode,history:history.slice(-16)})});
const data=await res.json();document.getElementById("typing")?.remove();if(!res.ok)throw new Error(data.error||"AI Teacher is not connected yet.");
const answer=data.answer||"I couldn't generate a response.";add("ai",answer);history.push({role:"assistant",content:answer});
}catch(e){document.getElementById("typing")?.remove();add("ai","I’m ready, but the AI Teacher service is not connected yet. Please deploy the Expert Sync Supabase AI Teacher function and add the OPENAI_API_KEY secret.");console.error(e)}finally{send.disabled=false;input.focus()}}
composer.addEventListener("submit",e=>{e.preventDefault();sendMessage(input.value)});
input.addEventListener("input",()=>{input.style.height="46px";input.style.height=Math.min(input.scrollHeight,130)+"px"});input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();composer.requestSubmit()}});
document.querySelectorAll("[data-prompt]").forEach(b=>b.addEventListener("click",()=>sendMessage(b.dataset.prompt)));
document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
document.getElementById("clearBtn").addEventListener("click",()=>{history=[];chat.innerHTML='<section class="welcome" id="welcome"><h1>New lesson. New start.</h1><p>Choose a mode or send me your first message.</p></section>';input.focus()});
</script>
</body>
</html>
