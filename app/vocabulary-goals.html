<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expert Sync Vocabulary Goals</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:30px 18px;text-align:center;border-radius:0 0 28px 28px}.wrap{max-width:900px;margin:auto;padding:16px}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{margin:8px 0;font-size:29px}.card{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 16px rgba(3,27,63,.06)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center;background:#f8fbff;border:1px solid #e1e8f2;border-radius:14px;padding:14px}.num{font-size:26px;font-weight:900;color:#063b91}.small{font-size:11px;color:#68768b;line-height:1.55}.bar{height:10px;background:#e5eaf2;border-radius:99px;overflow:hidden;margin:8px 0}.fill{height:100%;background:linear-gradient(90deg,#063b91,#d4af37)}.goal{border:1px solid #dbe5f2;border-radius:14px;padding:14px;margin:8px 0}.goal h3{margin:0;color:#063b91}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.row{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}@media print{.row,footer{display:none}.card,.stat{box-shadow:none}}</style></head><body><header class="hero"><div class="eyebrow">STAGE 45 • EXPERT SYNC ENGLISH ACADEMY</div><h1>🎯 Personal Vocabulary Goals</h1><p>Turn your diagnostic, progress and weekly activity into clear learning targets.</p></header><main class="wrap"><div class="grid" id="stats"></div><div class="card"><h3 style="color:#063b91">Your Goals</h3><div id="goals"></div></div><div class="card"><h3 style="color:#063b91">Suggested Weekly Target</h3><div id="target"></div></div><div class="card"><div class="row"><button class="btn gold" onclick="location.href='vocabulary-streak.html'">🔥 Streak</button><button class="btn gold" onclick="location.href='vocabulary-daily.html'">🎯 Start Mission</button><button class="btn light" onclick="location.href='vocabulary-weekly-report.html'">📊 Weekly Review</button><button class="btn light" onclick="location.href='vocabulary-analytics.html'">📊 Analytics</button><button class="btn light" onclick="location.href='vocabulary-plan.html'">🎓 My Plan</button><button class="btn light" onclick="location.href='vocabulary-profile.html'">👤 Profile</button></div></div></main><footer style="text-align:center;padding:25px;color:#6b778b;font-size:11px">© 2026 Expert Sync English Academy</footer><script src="vocabulary-schema.js"></script><script>const E=window.ESAVocabularyEntries||[],PKEY="esaVocabularyProgressV1",DKEY="esaDailyVocabularyMissionV1",GKEY="esaVocabularyGoalsV1";function get(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}function render(){const p=get(PKEY,{}),d=get(DKEY,{}),now=Date.now(),week=now-7*86400000,known=Object.values(p).filter(x=>x.status==="known").length,attempts=Object.values(p).reduce((n,x)=>n+(x.attempts||0),0),correct=Object.values(p).reduce((n,x)=>n+(x.correct||0),0),acc=attempts?Math.round(correct/attempts*100):0,recent=Object.values(p).filter(x=>x.lastReviewed&&new Date(x.lastReviewed).getTime()>=week).length,days=new Set(Object.values(p).filter(x=>x.lastReviewed&&new Date(x.lastReviewed).getTime()>=week).map(x=>new Date(x.lastReviewed).toISOString().slice(0,10))).size;const goal=get(GKEY,{words:20,accuracy:80,days:5});localStorage.setItem(GKEY,JSON.stringify(goal));const metrics=[["Mastered",known,goal.words],["Recall",acc,goal.accuracy],["Active Days",days,goal.days]];document.getElementById("stats").innerHTML=metrics.map(x=>'<div class="stat"><div class="num">'+x[1]+(x[0]==="Recall"?"%":"")+'</div><div class="small">'+x[0]+' • target '+x[2]+(x[0]==="Recall"?"%":"")+'</div></div>').join("");document.getElementById("goals").innerHTML=metrics.map(x=>'<div class="goal"><h3>'+x[0]+'</h3><div class="bar"><div class="fill" style="width:'+Math.min(100,Math.round(x[1]/x[2]*100))+'%"></div></div><div class="small">'+Math.min(x[1],x[2])+' / '+x[2]+' toward target</div></div>').join("");const weekly=Math.max(10,Math.min(50,known?Math.ceil(known/2):20));document.getElementById("target").innerHTML='<div class="goal"><strong>'+weekly+' vocabulary words this week</strong><div class="small">Based on your current activity. If recall is below 70%, prioritize review over adding new words. Current 7-day activity: '+recent+' words touched across '+days+' day'+(days===1?'':'s')+'.</div></div>'}render()</script></body></html>
