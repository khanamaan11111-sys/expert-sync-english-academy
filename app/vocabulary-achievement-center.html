<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expert Sync Vocabulary Achievement Center</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:30px 18px;text-align:center;border-radius:0 0 28px 28px}.wrap{max-width:900px;margin:auto;padding:16px}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{margin:8px 0;font-size:29px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.card,.badge{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:17px;box-shadow:0 5px 16px rgba(3,27,63,.06)}.stat{text-align:center}.num{font-size:27px;font-weight:900;color:#063b91}.small{font-size:11px;color:#68768b;line-height:1.55}.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.badge{text-align:center}.badge.locked{opacity:.48;filter:grayscale(.7)}.icon{font-size:30px}.badge h3{color:#063b91;margin:7px 0 4px;font-size:14px}.bar{height:10px;background:#e5eaf2;border-radius:99px;overflow:hidden;margin:8px 0}.fill{height:100%;background:linear-gradient(90deg,#063b91,#d4af37)}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#edf4fd;color:#063b91;font-size:9px;font-weight:900;margin:3px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.row{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.badges{grid-template-columns:1fr 1fr}}@media(max-width:450px){.badges{grid-template-columns:1fr}}@media print{.row,footer{display:none}.card,.stat,.badge{box-shadow:none}}</style></head><body><header class="hero"><div class="eyebrow">STAGE 47 • EXPERT SYNC ENGLISH ACADEMY</div><h1>🏅 Achievement Center</h1><p>Celebrate meaningful vocabulary progress without confusing badges with proficiency.</p></header><main class="wrap"><div class="grid" id="stats"></div><div class="card"><h3 style="color:#063b91;margin:0">⭐ XP Progress</h3><div class="num"><span id="xp">0</span> XP</div><div class="bar"><div class="fill" id="fill"></div></div><div class="small" id="next"></div></div><div class="card"><h3 style="color:#063b91">🏆 Badges</h3><div class="badges" id="badges"></div></div><div class="card"><div class="row"><button class="btn gold" onclick="location.href='vocabulary-daily.html'">🎯 Daily Mission</button><button class="btn light" onclick="location.href='vocabulary-mastery-engine.html'">🧠 Mastery</button><button class="btn light" onclick="location.href='vocabulary-streak.html'">🔥 Streak</button><button class="btn light" onclick="location.href='vocabulary-goals.html'">🎯 Goals</button><button class="btn light" onclick="location.href='vocabulary-profile.html'">👤 Profile</button></div></div></main><footer style="text-align:center;padding:25px;color:#6b778b;font-size:11px">© 2026 Expert Sync English Academy</footer><script src="vocabulary-schema.js"></script><script>const E=window.ESAVocabularyEntries||[],P="esaVocabularyProgressV1",S="esaSpacedRepetitionV1",H="esaVocabularyChallengeHistory",D="esaDailyVocabularyMissionV1";function get(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}function data(){const p=get(P,{}),h=get(H,[]),s=get(S,{}),d=get(D,{}),w=Object.keys(p),attempts=w.reduce((n,x)=>n+(p[x].attempts||0),0),correct=w.reduce((n,x)=>n+(p[x].correct||0),0),known=w.filter(x=>p[x].status==="known").length,days=new Set(w.filter(x=>p[x].lastReviewed).map(x=>new Date(p[x].lastReviewed).toISOString().slice(0,10))).size,best=h.length?Math.max(...h.map(x=>x.score||0)):0,completed=Object.values(d).filter(x=>x.words?.length&&x.completed?.length===x.words.length).length,reps=Object.values(s).reduce((n,x)=>n+(x.reps||0),0);return{p,h,s,d,w,attempts,correct,known,days,best,completed,reps,accuracy:attempts?Math.round(correct/attempts*100):0}}function render(){const x=data(),xp=x.known*10+x.correct*2+x.h.length*25+x.best+x.completed*15+x.reps*5;document.getElementById("stats").innerHTML='<div class="stat"><div class="num">'+x.known+'</div><div class="small">Known Words</div></div><div class="stat"><div class="num">'+x.accuracy+'%</div><div class="small">Recall Accuracy</div></div><div class="stat"><div class="num">'+x.days+'</div><div class="small">Learning Days</div></div><div class="stat"><div class="num">'+x.reps+'</div><div class="small">Spaced Reps</div></div>';document.getElementById("xp").textContent=xp;const level=Math.floor(xp/100)+1,base=level*100;document.getElementById("fill").style.width=Math.min(100,xp%100)+"%";document.getElementById("next").textContent="Level "+level+" • "+(base-xp%100)+" XP to the next level";const defs=[["🌱","First Step","Mark your first word as known.",x.known>=1,25],["📚","10 Words","Mark 10 words as known.",x.known>=10,50],["🧠","Recall Builder","Complete 10 recorded interactions.",x.attempts>=10,75],["🎯","90% Recall","Reach 90% accuracy after at least 10 interactions.",x.accuracy>=90&&x.attempts>=10,125],["🔥","5-Day Habit","Learn vocabulary on 5 different days.",x.days>=5,100],["🗓️","Spaced Learner","Complete 5 spaced repetitions.",x.reps>=5,100],["🏁","Challenge Finisher","Complete 3 challenges.",x.h.length>=3,100],["🥇","Challenge 85","Score 85+ in a challenge.",x.best>=85,125],["🎯","Mission Builder","Complete 5 daily missions.",x.completed>=5,100],["🏆","25 Known","Mark 25 words as known.",x.known>=25,150]];document.getElementById("badges").innerHTML=defs.map(b=>'<article class="badge '+(b[3]?"":"locked")+'"><div class="icon">'+b[0]+'</div><h3>'+b[1]+'</h3><p>'+b[2]+'</p><div class="tag">'+(b[3]?"UNLOCKED":"LOCKED")+'</div><div class="small">+'+b[4]+' XP</div></article>').join("")}render()</script></body></html>
