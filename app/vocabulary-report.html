<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031b3f"><title>Expert Sync Vocabulary Report</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:30px 18px;border-radius:0 0 28px 28px;text-align:center}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{margin:8px 0;font-size:29px}.hero p{max-width:700px;margin:auto;color:#dce9f7;font-size:13px;line-height:1.55}.wrap{max-width:900px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.card{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:17px;box-shadow:0 5px 16px rgba(3,27,63,.06)}.stat{text-align:center}.num{font-size:26px;font-weight:900;color:#063b91}.lab{font-size:10px;color:#68768b;margin-top:5px}.card{margin-top:12px}.title{color:#063b91;margin:0 0 10px}.bar,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.attempt{display:grid;grid-template-columns:1.5fr .7fr .7fr .8fr .8fr;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid #edf1f6;font-size:12px}.attempt:last-child{border-bottom:0}.badge{padding:5px 8px;border-radius:99px;background:#edf4fd;color:#063b91;font-size:10px;font-weight:900;text-align:center}.improve{font-size:13px;line-height:1.55}.empty{text-align:center;color:#68768b;padding:30px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.attempt{grid-template-columns:1fr 1fr}.attempt div:first-child{grid-column:1/-1}}@media print{.bar,footer{display:none}.card,.stat{box-shadow:none}}</style></head><body>
<header class="hero"><div class="eyebrow">STAGE 23 • EXPERT SYNC ENGLISH ACADEMY</div><h1>📈 Vocabulary Challenge Report</h1><p>A clear record of challenge performance, improvement and mistakes for student self-review.</p></header>
<main class="wrap"><div class="grid" id="stats"></div><div class="card"><h3 class="title">Performance Summary</h3><div class="improve" id="summary"></div></div><div class="card"><h3 class="title">Challenge History</h3><div id="history"></div></div><div class="card"><h3 class="title">Most Recent Mistakes</h3><div id="mistakes"></div></div><div class="card"><div class="bar"><button class="btn gold" onclick="location.href='vocabulary-challenge.html'">🏁 New Challenge</button><button class="btn light" onclick="location.href='vocabulary-mastery.html'">🏆 Mastery</button><button class="btn light" onclick="location.href='vocabulary-review.html'">🧠 Smart Review</button><button class="btn light" onclick="window.print()">📥 Save Report PDF</button><button class="btn light" onclick="clearHistory()">Clear History</button></div></div></main><footer style="text-align:center;padding:25px;color:#6b778b;font-size:11px">© 2026 Expert Sync English Academy</footer>
<script>
const KEY="esaVocabularyChallengeHistory";
function get(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return []}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){const h=get(),total=h.reduce((n,x)=>n+x.total,0),correct=h.reduce((n,x)=>n+x.correct,0),avg=h.length?Math.round(h.reduce((n,x)=>n+x.score,0)/h.length):0,best=h.length?Math.max(...h.map(x=>x.score)):0,accuracy=total?Math.round(correct/total*100):0;document.getElementById("stats").innerHTML='<div class="stat"><div class="num">'+h.length+'</div><div class="lab">Challenges</div></div><div class="stat"><div class="num">'+best+'</div><div class="lab">Best Score</div></div><div class="stat"><div class="num">'+avg+'</div><div class="lab">Average Score</div></div><div class="stat"><div class="num">'+accuracy+'%</div><div class="lab">Overall Accuracy</div></div>';let trend="Start your first challenge to create a baseline.";if(h.length>=2){const recent=h[0].score,previous=h[1].score,d=recent-previous;trend=d>0?"Your latest score improved by "+d+" points compared with the previous challenge.":"Your latest score is "+Math.abs(d)+" points "+(d<0?"below":"level with")+" the previous challenge. Use Mistake Review to target weak words."}document.getElementById("summary").textContent=trend;document.getElementById("history").innerHTML=h.length?'<div class="attempt"><strong>Date</strong><strong>Score</strong><strong>Accuracy</strong><strong>Level</strong><strong>Questions</strong></div>'+h.map(x=>'<div class="attempt"><div>'+new Date(x.date).toLocaleString()+'</div><div><span class="badge">'+x.score+'/100</span></div><div>'+x.accuracy+'%</div><div>'+esc(x.level)+'</div><div>'+x.correct+'/'+x.total+'</div></div>').join(""):'<div class="empty">No challenge attempts yet. Complete a Vocabulary Challenge to build your report.</div>';const ms=[];h.slice(0,10).forEach(x=>(x.mistakes||[]).forEach(m=>ms.push({date:x.date,...m})));document.getElementById("mistakes").innerHTML=ms.length?ms.slice(0,12).map(m=>'<div class="attempt"><div><strong>'+esc(m.word)+'</strong><br><span class="small">'+new Date(m.date).toLocaleDateString()+'</span></div><div style="grid-column:span 2">Correct: '+esc(m.correct)+'</div><div style="grid-column:span 2">Your answer: '+esc(m.picked)+'</div></div>').join(""):'<div class="empty">No mistakes recorded yet. Excellent work if you have completed a challenge.</div>'}
function clearHistory(){if(confirm("Clear all saved challenge history on this device?")){localStorage.removeItem(KEY);render()}}
render();
</script></body></html>
