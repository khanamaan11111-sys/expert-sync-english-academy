<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expert Sync Dictionary Search</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:28px 18px;border-radius:0 0 28px 28px}.wrap{max-width:950px;margin:auto;padding:16px}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{margin:8px 0;font-size:29px}.search{display:flex;gap:8px;margin-top:15px}.search input{flex:1;padding:13px;border:0;border-radius:11px;font-size:15px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.filters select{padding:10px;border:1px solid #cbd7e7;border-radius:10px;background:#fff}.card{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 5px 16px rgba(3,27,63,.06)}.results{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.entry{padding:14px;border:1px solid #dbe5f2;border-radius:14px}.entry h3{margin:0;color:#063b91}.small{font-size:11px;color:#68768b}.tag{display:inline-block;padding:4px 7px;border-radius:99px;background:#edf4fd;color:#063b91;font-size:9px;font-weight:900;margin:3px}.empty{text-align:center;padding:30px;color:#68768b}.suggest{padding:8px 10px;border-bottom:1px solid #e8edf4;cursor:pointer;background:#fff}.suggest:hover{background:#f4f8ff}.suggestbox{position:absolute;left:0;right:0;top:48px;z-index:5;border:1px solid #cbd7e7;border-radius:10px;overflow:hidden;box-shadow:0 8px 20px rgba(3,27,63,.12)}@media(max-width:650px){.results{grid-template-columns:1fr}.search{flex-direction:column}}</style></head><body>
<header class="hero"><div class="wrap" style="padding:0"><div class="eyebrow">STAGE 34 • EXPERT SYNC ENGLISH ACADEMY</div><h1>🔎 Dictionary Search & Discovery</h1><div class="search" style="position:relative"><input id="q" autocomplete="off" placeholder="Search word, meaning or Hinglish..." oninput="suggest()" onkeydown="if(event.key==='Enter')search()"><button class="btn gold" onclick="search()">Search</button><div id="suggestions" class="suggestbox"></div></div></div></header>
<main class="wrap"><div class="card"><div class="filters"><select id="level" onchange="search()"><option value="">All CEFR levels</option><option>A2</option><option>B1</option><option>B2</option></select><select id="cat" onchange="search()"><option value="">All categories</option><option value="aviation">Aviation</option><option value="customer-service">Customer Service</option><option value="interview">Interview</option><option value="workplace">Workplace</option><option value="speaking">Speaking</option></select><button class="btn light" onclick="wordOfDay()">📅 Word of the Day</button><button class="btn light" onclick="saved()">⭐ Saved Words</button></div></div><div id="content"></div><div class="card"><div class="row"><button class="btn light" onclick="location.href='dictionary-pro.html'">📖 Rich Entry</button><button class="btn light" onclick="location.href='vocabulary-hub.html'">🧭 Discovery Hub</button><button class="btn light" onclick="location.href='vocabulary-trainer.html'">📚 Trainer</button><button class="btn light" onclick="location.href='vocabulary-profile.html'">👤 Profile</button><button class="btn light" onclick="location.href='pronunciation-lab.html'">🔊 Pronunciation</button><button class="btn light" onclick="location.href='vocabulary-wordbook.html'">⭐ Wordbook</button></div></div></main>
<script src="vocabulary-schema.js"></script><script>
const E=window.ESAVocabularyEntries||[],PROG="esaVocabularyProgressV1",REC="esaDictionaryRecentV1",SAVE="esaDictionarySavedV1";
function get(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function openWord(w){localStorage.setItem(REC,JSON.stringify([w,...get(REC,[]).filter(x=>x!==w)].slice(0,10)));location.href="dictionary-pro.html?word="+encodeURIComponent(w)}
function saveWord(w){const a=get(SAVE,[]);if(!a.includes(w))a.unshift(w);localStorage.setItem(SAVE,JSON.stringify(a.slice(0,100)));search()}
function suggest(){const q=document.getElementById("q").value.trim().toLowerCase();const box=document.getElementById("suggestions");if(!q){box.innerHTML="";return}box.innerHTML=E.filter(x=>(x.w+" "+x.meaning+" "+x.hinglish).toLowerCase().includes(q)).slice(0,6).map(x=>'<div class="suggest" onclick="openWord('+JSON.stringify(x.w)+')"><strong>'+esc(x.w)+'</strong> <span class="small">— '+esc(x.meaning)+'</span></div>').join("")}
function search(){const q=document.getElementById("q").value.trim().toLowerCase(),l=document.getElementById("level").value,c=document.getElementById("cat").value;document.getElementById("suggestions").innerHTML="";let a=E.filter(x=>(!q||(x.w+" "+x.meaning+" "+x.hinglish).toLowerCase().includes(q))&&(!l||x.level===l)&&(!c||x.category===c));render(a,q?"Search results":"Browse vocabulary")}
function render(a,title){document.getElementById("content").innerHTML='<div class="card"><h2 style="color:#063b91;margin-top:0">'+title+'</h2><div class="results">'+(a.length?a.map(x=>'<article class="entry"><h3>'+esc(x.w)+'</h3><div><span class="tag">'+esc(x.level)+'</span><span class="tag">'+esc(x.category)+'</span></div><p style="font-size:12px;line-height:1.45">'+esc(x.meaning)+'</p><div class="small">'+esc(x.hinglish)+'</div><button class="btn light" style="margin-top:9px" onclick="openWord('+JSON.stringify(x.w)+')">Open Entry →</button></article>').join(""):'<div class="empty">No matching vocabulary found. Try another spelling, meaning, CEFR level or category.</div>')+'</div></div>'}
function wordOfDay(){const key=new Date().toISOString().slice(0,10),idx=E.length?hash(key)%E.length:0;document.getElementById("q").value=E[idx]?.w||"";search()}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function saved(){const a=get(SAVE,[]).map(w=>E.find(x=>x.w===w)).filter(Boolean);render(a,"⭐ Saved Words")}
render(E.slice(0,12),"Browse Vocabulary");
</script></body></html>
