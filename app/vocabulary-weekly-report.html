<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expert Sync Weekly Vocabulary Review</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:30px 18px;text-align:center;border-radius:0 0 28px 28px}.wrap{max-width:900px;margin:auto;padding:16px}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{margin:8px 0;font-size:29px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.card{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 5px 16px rgba(3,27,63,.06)}.stat{text-align:center}.num{font-size:27px;font-weight:900;color:#063b91}.small{font-size:11px;color:#68768b;line-height:1.55}.title{color:#063b91;margin:0 0 9px}.bar{height:10px;background:#e5eaf2;border-radius:99px;overflow:hidden;margin:7px 0}.fill{height:100%;background:linear-gradient(90deg,#063b91,#d4af37)}.item{padding:12px;border:1px solid #dbe5f2;border-radius:13px;margin:8px 0}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#edf4fd;color:#063b91;font-size:9px;font-weight:900;margin:3px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.row{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr}}@media print{.row,footer{display:none}.card,.stat{box-shadow:none}}</style></head><body><header class="hero"><div class="eyebrow">STAGE 44 • EXPERT SYNC ENGLISH ACADEMY</div><h1>📊 Weekly Vocabulary Review</h1><p>A student-friendly summary of the last seven days: activity, recall, progress and what to practice next.</p></header><main class="wrap"><div class="grid" id="stats"></div><div class="card"><h3 class="title">📈 This Week</h3><div id="week"></div></div><div class="card"><h3 class="title">🎯 Recommended Focus</h3><div id="focus"></div></div><div class="card"><h3 class="title">🏆 Progress Snapshot</h3><div id="snapshot"></div></div><div class="card"><div class="row"><button class="btn gold" onclick="location.href='vocabulary-daily.html'">🎯 Today's Mission</button><button class="btn light" onclick="location.href='vocabulary-review.html'">🧠 Smart Review</button><button class="btn light" onclick="location.href='vocabulary-mastery-engine.html'">🏆 Mastery Evidence</button><button class="btn light" onclick="location.href='vocabulary-profile.html'">👤 Profile</button><button class="btn light" onclick="window.print()">📥 Save Weekly Report</button></div></div></main><footer style="text-align:center;padding:25px;color:#6b778b;font-size:11px">© 2026 Expert Sync English Academy</footer><script src="vocabulary-schema.js"></script><script>const E=window.ESAVocabularyEntries||[],PKEY="esaVocabularyProgressV1",HKEY="esaVocabularyChallengeHistory",DKEY="esaDailyVocabularyMissionV1";function get(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function dateKey(d){return new Date(d).toISOString().slice(0,10)}function render(){const p=get(PKEY,{}),h=get(HKEY,[]),d=get(DKEY,{}),now=Date.now(),cut=now-7*86400000;const recentWords=Object.entries(p).filter(([,x])=>x.lastReviewed&&new Date(x.lastReviewed).getTime()>=cut);const attempts=recentWords.reduce((n,[,x])=>n+(x.attempts||0),0),correct=recentWords.reduce((n,[,x])=>n+(x.correct||0),0),acc=attempts?Math.round(correct/attempts*100):0;const recentChallenges=h.filter(x=>x.date&&new Date(x.date).getTime()>=cut),completedDays=new Set(Object.values(d).filter(x=>x.completed?.length===x.words?.length&&x.date&&new Date(x.date).getTime()>=cut).map(x=>x.date)).size;const mastered=Object.values(p).filter(x=>x.status==="known").length,review=Object.entries(p).filter(([,x])=>x.status==="practice").map(([w])=>E.find(e=>e.w===w)).filter(Boolean);document.getElementById("stats").innerHTML='<div class="stat"><div class="num">'+recentWords.length+'</div><div class="small">Words Touched</div></div><div class="stat"><div class="num">'+attempts+'</div><div class="small">Interactions</div></div><div class="stat"><div class="num">'+acc+'%</div><div class="small">Recall</div></div><div class="stat"><div class="num">'+completedDays+'</div><div class="small">Mission Days</div></div>';document.getElementById("week").innerHTML='<div class="item"><strong>Review accuracy</strong><div class="bar"><div class="fill" style="width:'+acc+'%"></div></div><div class="small">'+acc+'% from '+attempts+' recorded interactions in the last 7 days.</div></div><div class="item"><strong>Challenge activity</strong><div class="small">'+recentChallenges.length+' challenge'+(recentChallenges.length===1?'':'s')+' completed this week.</div></div>';document.getElementById("focus").innerHTML=review.slice(0,6).map(x=>'<div class="item"><strong>'+esc(x.w)+'</strong><span class="tag">'+esc(x.level)+'</span><div class="small">'+esc(x.meaning)+'</div></div>').join("")||'<div class="small">No practice list is currently flagged. Keep building consistency with Daily Mission and Smart Review.</div>';document.getElementById("snapshot").innerHTML='<div class="item"><strong>'+mastered+' words marked Known</strong><div class="small">For stronger mastery evidence, continue spaced review and active sentence/context practice.</div></div>'}render()</script></body></html>
