<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expert Sync Vocabulary Analytics</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:30px 18px;text-align:center;border-radius:0 0 28px 28px}.wrap{max-width:920px;margin:auto;padding:16px}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{margin:8px 0;font-size:29px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.card{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 5px 16px rgba(3,27,63,.06)}.stat{text-align:center}.num{font-size:27px;font-weight:900;color:#063b91}.small{font-size:11px;color:#68768b;line-height:1.55}.item{padding:13px;border:1px solid #dbe5f2;border-radius:13px;margin:8px 0}.bar{height:10px;background:#e5eaf2;border-radius:99px;overflow:hidden;margin:7px 0}.fill{height:100%;background:linear-gradient(90deg,#063b91,#d4af37)}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#edf4fd;color:#063b91;font-size:9px;font-weight:900;margin:3px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.row{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr}}@media print{.row,footer{display:none}.card,.stat{box-shadow:none}}</style></head><body><header class="hero"><div class="eyebrow">STAGE 48 • EXPERT SYNC ENGLISH ACADEMY</div><h1>📊 Vocabulary Analytics</h1><p>Understand what you are learning, where you are strong, and where practice should go next.</p></header><main class="wrap"><div class="grid" id="stats"></div><div class="card"><h3 style="color:#063b91">🎯 Category Performance</h3><div id="cats"></div></div><div class="card"><h3 style="color:#063b91">📚 CEFR Coverage</h3><div id="levels"></div></div><div class="card"><h3 style="color:#063b91">⚠️ Priority Review</h3><div id="priority"></div></div><div class="card"><h3 style="color:#063b91">💡 Learning Interpretation</h3><div id="insight" class="small"></div></div><div class="card"><div class="row"><button class="btn gold" onclick="location.href='vocabulary-mastery-engine.html'">🏆 Mastery</button><button class="btn light" onclick="location.href='vocabulary-goals.html'">🎯 Goals</button><button class="btn light" onclick="location.href='vocabulary-spaced-review.html'">🗓️ Review Planner</button><button class="btn light" onclick="location.href='vocabulary-weekly-report.html'">📊 Weekly Review</button><button class="btn light" onclick="location.href='vocabulary-profile.html'">👤 Profile</button><button class="btn light" onclick="window.print()">📥 Save Analytics</button></div></div></main><footer style="text-align:center;padding:25px;color:#6b778b;font-size:11px">© 2026 Expert Sync English Academy</footer><script src="vocabulary-schema.js"></script><script>const E=window.ESAVocabularyEntries||[],P="esaVocabularyProgressV1",S="esaSpacedRepetitionV1";function get(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}function render(){const p=get(P,{}),s=get(S,{}),known=Object.values(p).filter(x=>x.status==="known").length,attempts=Object.values(p).reduce((n,x)=>n+(x.attempts||0),0),correct=Object.values(p).reduce((n,x)=>n+(x.correct||0),0),acc=attempts?Math.round(correct/attempts*100):0,tracked=Object.keys(p).length,reps=Object.values(s).reduce((n,x)=>n+(x.reps||0),0);document.getElementById("stats").innerHTML='<div class="stat"><div class="num">'+tracked+'</div><div class="small">Words Tracked</div></div><div class="stat"><div class="num">'+known+'</div><div class="small">Marked Known</div></div><div class="stat"><div class="num">'+acc+'%</div><div class="small">Recorded Recall</div></div><div class="stat"><div class="num">'+reps+'</div><div class="small">Spaced Reps</div></div>';const cats=[...new Set(E.map(x=>x.category))];document.getElementById("cats").innerHTML=cats.map(c=>{const a=E.filter(x=>x.category===c),k=a.filter(x=>p[x.w]?.status==="known").length,pc=a.length?Math.round(k/a.length*100):0;return '<div class="item"><strong>'+c.replace("-"," ")+'</strong><div class="bar"><div class="fill" style="width:'+pc+'%"></div></div><div class="small">'+k+' / '+a.length+' marked known • '+pc+'%</div></div>'}).join("");const ls=["A2","B1","B2"];document.getElementById("levels").innerHTML=ls.map(l=>{const a=E.filter(x=>x.level===l),k=a.filter(x=>p[x.w]?.status==="known").length,pc=a.length?Math.round(k/a.length*100):0;return '<div class="item"><strong>'+l+'</strong><span class="tag">'+a.length+' available</span><div class="bar"><div class="fill" style="width:'+pc+'%"></div></div><div class="small">'+k+' marked known • '+pc+'% coverage</div></div>'}).join("");const priority=E.map(e=>{const x=p[e.w]||{};return {...e,attempts:x.attempts||0,correct:x.correct||0,status:x.status}}).filter(x=>x.status==="practice"||x.attempts>0).sort((a,b)=>(a.correct/(a.attempts||1))-(b.correct/(b.attempts||1))).slice(0,8);document.getElementById("priority").innerHTML=priority.length?priority.map(x=>'<div class="item"><strong>'+x.w+'</strong><span class="tag">'+x.level+'</span><div class="small">'+x.meaning+' • '+Math.round(x.correct/(x.attempts||1)*100)+'% recorded accuracy</div></div>').join(""):'<div class="small">Practice data will appear as you use the vocabulary activities.</div>';document.getElementById("insight").textContent=tracked===0?"Begin with Daily Mission or Dictionary Search. Analytics will populate from actual learning activity.":acc<70?"Your recorded recall is below 70%. Prioritize Smart Review, Spaced Review and Sentence Builder before adding a large amount of new vocabulary.":known<tracked/2?"You have a growing vocabulary set. Keep reviewing less-secure words while gradually increasing active production.":"Your tracked vocabulary is showing healthy coverage. Continue spaced review and active sentence/context practice to strengthen retention."}render()</script></body></html>
