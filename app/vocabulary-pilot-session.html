<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expert Sync Vocabulary Pilot Session</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:34px 18px;border-radius:0 0 30px 30px;text-align:center}.wrap{max-width:900px;margin:auto;padding:16px}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{font-size:30px;margin:8px 0}.card{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 16px rgba(3,27,63,.06)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{text-align:center;background:#f8fbff;border:1px solid #e1e8f2;border-radius:14px;padding:14px}.num{font-size:27px;font-weight:900;color:#063b91}.small{font-size:11px;color:#68768b;line-height:1.55}.step{padding:13px;border:1px solid #dbe5f2;border-radius:13px;margin:8px 0}.done{border-color:#168a45;background:#f1faf4}.warn{border-color:#e1bd62;background:#fffaf0}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr}}@media print{.row,footer{display:none}.card,.stat{box-shadow:none}}</style></head><body><header class="hero"><div class="eyebrow">STAGE 56 • EXPERT SYNC ENGLISH ACADEMY</div><h1>🧪 Pilot Session Tracker</h1><p>Track one pilot session from setup through observation and student feedback.</p></header><main class="wrap"><div class="grid" id="stats"></div><div class="card"><h2 style="color:#063b91">Session Setup</h2><div class="step"><strong>Session ID</strong><div class="small" id="sid"></div></div><div class="step"><strong>Date</strong><div class="small" id="date"></div></div><div class="step"><label><input type="checkbox" id="consent" onchange="save()"> Pilot participant has been informed that this is a prototype/pilot.</label></div></div><div class="card"><h2 style="color:#063b91">Session Milestones</h2><div id="milestones"></div></div><div class="card"><h2 style="color:#063b91">Session Outcome</h2><div id="outcome"></div></div><div class="card"><div class="row"><button class="btn gold" onclick="location.href='vocabulary-pilot-facilitator.html'">🧑‍🏫 Facilitator</button><button class="btn light" onclick="location.href='vocabulary-feedback.html'">💬 Feedback</button><button class="btn light" onclick="location.href='vocabulary-feedback-insights.html'">📋 Insights</button><button class="btn light" onclick="location.href='vocabulary-command-center.html'">🚀 Command Center</button></div></div></main><footer style="text-align:center;padding:25px;color:#6b778b;font-size:11px">© 2026 Expert Sync English Academy</footer><script>const KEY="esaVocabularyPilotSessionV1";const names=["Onboarding opened","Dictionary activity completed","Active practice completed","Review activity completed","Student feedback submitted"];function get(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}function save(){const x=get();x.consent=document.getElementById("consent").checked;localStorage.setItem(KEY,JSON.stringify(x));render()}function toggle(i,v){const x=get();x.steps=x.steps||[];x.steps[i]=v;x.startedAt=x.startedAt||new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(x));render()}function render(){const x=get(),steps=x.steps||[],done=steps.filter(Boolean).length;document.getElementById("sid").textContent=x.id||(x.id="PILOT-"+new Date().toISOString().replace(/\D/g,"").slice(0,14));document.getElementById("date").textContent=x.startedAt?new Date(x.startedAt).toLocaleString():new Date().toLocaleString();document.getElementById("consent").checked=!!x.consent;document.getElementById("stats").innerHTML='<div class="stat"><div class="num">'+done+'/5</div><div class="small">Milestones</div></div><div class="stat"><div class="num">'+(x.consent?"✓":"—")+'</div><div class="small">Pilot Briefing</div></div><div class="stat"><div class="num">'+(done===5?"Ready":"In Progress")+'</div><div class="small">Session Status</div></div><div class="stat"><div class="num">'+(x.startedAt?new Date(x.startedAt).toLocaleDateString():"—")+'</div><div class="small">Session Date</div></div>';document.getElementById("milestones").innerHTML=names.map((n,i)=>'<div class="step '+(steps[i]?"done":"")+'"><label><input type="checkbox" '+(steps[i]?"checked":"")+' onchange="toggle('+i+',this.checked)"> '+(steps[i]?"✓ ":"")+n+'</label></div>').join("");document.getElementById("outcome").innerHTML=done===5?'<div class="step done"><strong>✓ Pilot session complete</strong><div class="small">Review facilitator notes and student feedback before making product changes.</div></div>':'<div class="step warn"><strong>Session in progress</strong><div class="small">Complete the remaining milestones. Do not infer learning outcomes from session completion alone.</div></div>'}render()</script></body></html>
