<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expert Sync Vocabulary Context Practice</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:30px 18px;text-align:center;border-radius:0 0 28px 28px}.wrap{max-width:850px;margin:auto;padding:16px}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{margin:8px 0;font-size:29px}.card{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 16px rgba(3,27,63,.06)}.word{font-size:34px;font-weight:900;color:#063b91}.small{font-size:11px;color:#68768b}.prompt{font-size:16px;font-weight:700;line-height:1.5;margin:12px 0}.option{padding:13px;border:1px solid #dbe5f2;border-radius:12px;background:#f8fbff;margin:8px 0;cursor:pointer;font-size:13px}.correct{background:#eef8f1!important;border-color:#168a45!important}.wrong{background:#fff1f1!important;border-color:#c62828!important}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.row{display:flex;gap:8px;flex-wrap:wrap}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#edf4fd;color:#063b91;font-size:10px;font-weight:900;margin:3px}.score{font-size:34px;font-weight:900;color:#063b91}@media(max-width:600px){.word{font-size:28px}}@media print{.row,footer{display:none}.card{box-shadow:none}}</style></head><body><header class="hero"><div class="wrap" style="padding:0"><div class="eyebrow">STAGE 40 • EXPERT SYNC ENGLISH ACADEMY</div><h1>🎯 Context Mastery</h1><p>Choose the most natural context for each vocabulary word and build deeper usage awareness.</p></div></header><main class="wrap"><div class="card" id="game"><div class="small">WORD</div><div class="word" id="word"></div><div><span class="tag" id="level"></span><span class="tag" id="cat"></span></div><div class="prompt" id="prompt"></div><div id="options"></div><div id="feedback"></div></div><div class="card"><div class="row"><button class="btn gold" onclick="start()">🔄 New Round</button><button class="btn light" onclick="location.href='vocabulary-usage-lab.html'">🧠 Usage Lab</button><button class="btn light" onclick="location.href='vocabulary-sentence-builder.html'">✍️ Sentence Builder</button><button class="btn light" onclick="location.href='dictionary-pro.html'">📖 Dictionary</button><button class="btn light" onclick="location.href='vocabulary-daily.html'">🎯 Daily Mission</button><button class="btn light" onclick="location.href='vocabulary-profile.html'">👤 Profile</button></div></div></main><footer style="text-align:center;padding:25px;color:#6b778b;font-size:11px">© 2026 Expert Sync English Academy</footer><script src="vocabulary-schema.js"></script><script>const E=window.ESAVocabularyEntries||[];let q=[],i=0,score=0;function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function start(){q=[...E].sort(()=>Math.random()-.5).slice(0,10);i=0;score=0;show()}function show(){if(i>=q.length)return finish();const e=q[i],correct=(e.contexts&&e.contexts[0])||e.category,others=[...new Set(E.flatMap(x=>x.contexts||[x.category]).filter(x=>x!==correct))].sort(()=>Math.random()-.5).slice(0,3),opts=[correct,...others].sort(()=>Math.random()-.5);document.getElementById("word").textContent=e.w;document.getElementById("level").textContent=e.level;document.getElementById("cat").textContent=e.category;document.getElementById("prompt").textContent="Which context is most relevant to this word?";document.getElementById("options").innerHTML=opts.map((x,n)=>'<div class="option" data-v="'+esc(x)+'" onclick="answer('+n+')">'+esc(x)+'</div>').join("");document.getElementById("feedback").innerHTML='<div class="small">Question '+(i+1)+' / '+q.length+'</div>';window._correct=correct}function answer(n){const os=[...document.querySelectorAll(".option")],ok=os[n].dataset.v===window._correct;os[n].classList.add(ok?"correct":"wrong");if(!ok)os.find(x=>x.dataset.v===window._correct)?.classList.add("correct");if(ok)score++;os.forEach(x=>x.onclick=null);setTimeout(()=>{i++;show()},550)}function finish(){document.getElementById("game").innerHTML='<div class="score">'+score+' / '+q.length+'</div><h2 style="color:#063b91">Context Round Complete</h2><p class="small">Use the Dictionary Pro entry and Sentence Builder to turn these recognition skills into active usage.</p><button class="btn gold" onclick="start()">Play Again</button>'}start()</script></body></html>
