<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031b3f"><title>Expert Sync Personalized Vocabulary Plan</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:30px 18px;border-radius:0 0 28px 28px;text-align:center}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{margin:8px 0;font-size:29px}.hero p{max-width:700px;margin:auto;color:#dce9f7;font-size:13px;line-height:1.55}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 16px rgba(3,27,63,.06)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center;background:#f8fbff;border:1px solid #e1e8f2;border-radius:14px;padding:14px}.num{font-size:26px;font-weight:900;color:#063b91}.small{font-size:11px;color:#68768b}.title{color:#063b91;margin:0 0 9px}.rec{padding:12px;background:#fff8df;border:1px solid #eadca7;border-radius:12px;font-size:12px;line-height:1.55;margin:8px 0}.path{padding:12px;border:1px solid #dbe5f2;border-radius:13px;margin:8px 0}.bar{height:9px;background:#e5eaf2;border-radius:99px;overflow:hidden;margin:7px 0}.fill{height:100%;background:linear-gradient(90deg,#063b91,#d4af37)}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#edf4fd;color:#063b91;font-size:10px;font-weight:900;margin:3px}@media(max-width:650px){.grid{grid-template-columns:1fr}}@media print{.row,footer{display:none}.card{box-shadow:none}}</style></head><body>
<header class="hero"><div class="eyebrow">STAGE 30 • EXPERT SYNC ENGLISH ACADEMY</div><h1>🎓 My Personalized Vocabulary Plan</h1><p>Your diagnostic, progress and performance data now combine into a practical learning plan.</p></header>
<main class="wrap"><div class="grid" id="stats"></div><div class="card"><h3 class="title">🎯 Your Recommended Plan</h3><div id="plan"></div></div><div class="card"><h3 class="title">🧭 Path Priorities</h3><div id="paths"></div></div><div class="card"><h3 class="title">📅 Your Daily Settings</h3><div id="daily"></div></div><div class="card"><h3 class="title">💡 Why this plan?</h3><div id="why"></div></div><div class="card"><div class="row"><button class="btn gold" onclick="location.href='vocabulary-daily.html'">🎯 Start Daily Mission</button><button class="btn light" onclick="location.href='vocabulary-challenge.html'">🏁 Personalized Challenge</button><button class="btn light" onclick="location.href='vocabulary-review.html'">🧠 Smart Review</button><button class="btn light" onclick="location.href='vocabulary-profile.html'">👤 Profile</button><button class="btn light" onclick="location.href='vocabulary-diagnostic.html'">🧪 Retake Diagnostic</button></div></div></main><footer style="text-align:center;padding:25px;color:#6b778b;font-size:11px">© 2026 Expert Sync English Academy</footer>
<script src="vocabulary-bank.js"></script><script>
const DKEY="esaVocabularyDiagnosticV1",PKEY="esaVocabularyProgressV1",HKEY="esaVocabularyChallengeHistory";
function get(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}
function render(){const d=get(DKEY,null),p=get(PKEY,{}),h=get(HKEY,[]),bank=window.ESAVocabularyBank||[];const level=d?.level||"A2";const known=Object.values(p).filter(x=>x.status==="known").length;const attempts=Object.values(p).reduce((n,x)=>n+(x.attempts||0),0),correct=Object.values(p).reduce((n,x)=>n+(x.correct||0),0),acc=attempts?Math.round(correct/attempts*100):0;const target=level==="B2"?"B2":level==="B1"?"B1":"A2";const difficulty=acc>=85&&level!=="A2"?"pro":acc<60?"foundation":"adaptive";const pathOrder=["aviation","customer-service","interview","workplace","speaking"].map(cat=>{const words=bank.filter(w=>w.category===cat),k=words.filter(w=>p[w.w]?.status==="known").length;return {cat,k,n:words.length,p:words.length?Math.round(k/words.length*100):0}}).sort((a,b)=>a.p-b.p);const primary=pathOrder[0]?.cat||"workplace";document.getElementById("stats").innerHTML='<div class="stat"><div class="num">'+target+'</div><div class="small">Target Level</div></div><div class="stat"><div class="num">'+difficulty+'</div><div class="small">Challenge Mode</div></div><div class="stat"><div class="num">'+(known+5)+'</div><div class="small">Daily Target</div></div>';document.getElementById("plan").innerHTML='<div class="rec"><strong>Start at '+target+'</strong> with '+primary.replace("-"," ")+' as your priority path. Use Daily Mission for new/recent words, Smart Review for weak words, and Challenge mode to measure progress.</div><span class="tag">Target: '+target+'</span><span class="tag">Mode: '+difficulty+'</span><span class="tag">Priority: '+primary+'</span>';document.getElementById("paths").innerHTML=pathOrder.map(x=>'<div class="path"><strong>'+x.cat.replace("-"," ")+'</strong><div class="bar"><div class="fill" style="width:'+x.p+'%"></div></div><div class="small">'+x.k+'/'+x.n+' mastered • '+x.p+'% • '+(x.cat===primary?"Priority practice":"Supporting practice")+'</div></div>').join("");document.getElementById("daily").innerHTML='<p class="small">Recommended daily load: <strong>'+(known+5)+' words</strong>. Challenge mode: <strong>'+difficulty+'</strong>. Target CEFR: <strong>'+target+'</strong>. Review weak words before adding more load.</p>';document.getElementById("why").innerHTML='<div class="rec">Diagnostic: '+(d?d.percent+"%":"not completed")+' • Current recall accuracy: '+acc+'% • Challenges: '+h.length+'. '+(d?"Your diagnostic provides the starting level; your ongoing accuracy adjusts the recommended challenge mode.":"Complete the diagnostic to personalize the plan.")+'</div>'}
render();
</script></body></html>
