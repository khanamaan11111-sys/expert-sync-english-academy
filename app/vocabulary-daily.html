<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031b3f"><title>Expert Sync Daily Vocabulary Mission</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:30px 18px;border-radius:0 0 28px 28px;text-align:center}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{margin:8px 0;font-size:29px}.hero p{max-width:700px;margin:auto;color:#dce9f7;font-size:13px;line-height:1.55}.wrap{max-width:850px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 16px rgba(3,27,63,.06)}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#b88600;font-weight:900}.num{font-size:28px;font-weight:900;color:#063b91}.word{font-size:26px;font-weight:900;color:#063b91}.meta,.small{font-size:11px;color:#68768b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#f8fbff;border:1px solid #e1e8f2;border-radius:14px;padding:13px;text-align:center}.bar{height:11px;background:#e5eaf2;border-radius:99px;overflow:hidden;margin:10px 0}.fill{height:100%;background:linear-gradient(90deg,#063b91,#d4af37)}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.row{display:flex;gap:8px;flex-wrap:wrap}.mission{border-left:4px solid #d4af37;padding-left:12px;line-height:1.55;font-size:13px}.done{background:#eef8f1;border-color:#cfe8d7}.done .fill{width:100%!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.row .btn{flex:1;min-width:130px}}@media print{.row,footer{display:none}.card{box-shadow:none}}</style></head><body>
<header class="hero"><div class="eyebrow">STAGE 26 • EXPERT SYNC ENGLISH ACADEMY</div><h1>🎯 Today's Vocabulary Mission</h1><p>One focused daily mission to turn vocabulary practice into a consistent learning habit.</p></header>
<main class="wrap"><div class="card" id="missionCard"><div class="top"><div><div class="label" id="date"></div><div class="num" id="title">Daily Mission</div></div><div class="num" id="pct">0%</div></div><div class="bar"><div class="fill" id="fill" style="width:0%"></div></div><div class="mission" id="goal"></div></div>
<div class="grid"><div class="metric"><div class="num" id="words">0/5</div><div class="small">Words reviewed</div></div><div class="metric"><div class="num" id="accuracy">0%</div><div class="small">Today's accuracy</div></div><div class="metric"><div class="num" id="streak">🔥 0</div><div class="small">Day streak</div></div></div>
<section id="wordsList"></section>
<div class="card"><div class="row"><button class="btn gold" onclick="location.href='vocabulary-trainer.html'">📚 Learn Today's Words</button><button class="btn light" onclick="location.href='vocabulary-review.html'">🧠 Smart Review</button><button class="btn light" onclick="location.href='vocabulary-challenge.html'">🏁 Challenge</button><button class="btn light" onclick="location.href='vocabulary-mastery.html'">🏆 Mastery</button><button class="btn light" onclick="location.href='vocabulary-achievements.html'">🏅 Achievements</button><button class="btn light" onclick="window.print()">📥 Save Mission</button></div></div></main>
<footer style="text-align:center;padding:25px;color:#6b778b;font-size:11px">© 2026 Expert Sync English Academy</footer>
<script src="vocabulary-bank.js"></script><script>
const DAYKEY="esaDailyVocabularyMissionV1",PROG="esaVocabularyProgressV1";
function today(){return new Date().toISOString().slice(0,10)}
function get(k){try{return JSON.parse(localStorage.getItem(k)||"{}")}catch(e){return {}}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function streak(){const p=get(PROG),days=new Set(Object.values(p).filter(x=>x.lastReviewed).map(x=>new Date(x.lastReviewed).toISOString().slice(0,10)));let d=new Date(),n=0;while(days.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
function build(){const key=today(),s=get(DAYKEY),p=get(PROG);if(!s[key]){const bank=window.ESAVocabularyBank||[];let seed=hash(key),pool=[...bank].sort((a,b)=>((hash(key+a.w)+seed)%997)-((hash(key+b.w)+seed)%997));const candidates=pool.filter(x=>p[x.w]?.status==="practice").concat(pool.filter(x=>p[x.w]?.status!=="practice"));s[key]={words:candidates.slice(0,5).map(x=>x.w),completed:[],createdAt:new Date().toISOString()};save(DAYKEY,s)}render(s[key],p)}
function render(m,p){const all=m.words||[],todayKey=today(),done=all.filter(w=>p[w]?.lastReviewed&&new Date(p[w].lastReviewed).toISOString().slice(0,10)===todayKey),att=all.reduce((n,w)=>n+(p[w]?.attempts||0),0),cor=all.reduce((n,w)=>n+(p[w]?.correct||0),0),pct=all.length?Math.round(done.length/all.length*100):0,acc=att?Math.round(cor/att*100):0;document.getElementById("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});document.getElementById("pct").textContent=pct+"%";document.getElementById("fill").style.width=pct+"%";document.getElementById("words").textContent=done.length+"/"+all.length;document.getElementById("accuracy").textContent=acc+"%";document.getElementById("streak").textContent="🔥 "+streak();document.getElementById("goal").innerHTML=done.length===all.length&&all.length?"<strong>Mission complete.</strong> Excellent consistency.":"<strong>Today's goal:</strong> review all "+all.length+" selected words. Complete Smart Review or Challenge practice, then return here to track the mission.";document.getElementById("missionCard").className="card "+(done.length===all.length&&all.length?"done":"");document.getElementById("wordsList").innerHTML='<div class="card"><h3 style="color:#063b91">Today's 5 Words</h3>'+all.map(w=>'<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf1f6"><div><strong>'+w+'</strong><div class="small">'+(p[w]?.status==="known"?"✓ Known":"↻ Practice")+'</div></div><span class="small">'+(done.includes(w)?"✓ Completed":"Not completed")+'</span></div>').join("")+'</div>'}
build();
</script></body></html>
