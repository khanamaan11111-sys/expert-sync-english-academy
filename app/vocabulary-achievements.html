<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031b3f"><title>Expert Sync Vocabulary Achievements</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:30px 18px;border-radius:0 0 28px 28px;text-align:center}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{margin:8px 0;font-size:29px}.hero p{max-width:700px;margin:auto;color:#dce9f7;font-size:13px;line-height:1.55}.wrap{max-width:900px;margin:auto;padding:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.card{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:17px;box-shadow:0 5px 16px rgba(3,27,63,.06)}.stat{text-align:center}.num{font-size:27px;font-weight:900;color:#063b91}.lab,.small{font-size:10px;color:#68768b;margin-top:5px}.achievements{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:12px}.badge{background:#fff;border:1px solid #dbe5f2;border-radius:16px;padding:15px;text-align:center}.badge.locked{opacity:.48;filter:grayscale(.7)}.icon{font-size:30px}.badge h3{font-size:14px;color:#063b91;margin:8px 0 5px}.badge p{font-size:11px;line-height:1.45;color:#68768b;margin:0}.xp{font-size:18px;font-weight:900;color:#b88600;margin-top:7px}.bar{height:10px;background:#e5eaf2;border-radius:99px;overflow:hidden;margin:9px 0}.fill{height:100%;background:linear-gradient(90deg,#063b91,#d4af37)}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.row{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.achievements{grid-template-columns:1fr 1fr}}@media(max-width:450px){.achievements{grid-template-columns:1fr}}@media print{.row,footer{display:none}.stat,.card,.badge{box-shadow:none}}</style></head><body>
<header class="hero"><div class="eyebrow">STAGE 27 • EXPERT SYNC ENGLISH ACADEMY</div><h1>🏅 Vocabulary Achievements</h1><p>Earn XP for consistent learning, review accuracy, challenge performance and vocabulary mastery.</p></header>
<main class="wrap"><div class="stats" id="stats"></div><div class="card"><h3 style="color:#063b91;margin:0">XP Progress</h3><div class="num"><span id="xp">0</span> XP</div><div class="bar"><div class="fill" id="xpfill" style="width:0%"></div></div><div class="small" id="next"></div></div><div class="achievements" id="badges"></div><div class="card" style="margin-top:12px"><div class="row"><button class="btn gold" onclick="location.href='vocabulary-daily.html'">🎯 Daily Mission</button><button class="btn light" onclick="location.href='vocabulary-challenge.html'">🏁 Challenge</button><button class="btn light" onclick="location.href='vocabulary-mastery.html'">🏆 Mastery</button><button class="btn light" onclick="location.href='vocabulary-report.html'">📈 Report</button><button class="btn light" onclick="window.print()">📥 Save Achievements</button></div></div></main><footer style="text-align:center;padding:25px;color:#6b778b;font-size:11px">© 2026 Expert Sync English Academy</footer>
<script>
const PROG="esaVocabularyProgressV1",HIST="esaVocabularyChallengeHistory",DAILY="esaDailyVocabularyMissionV1";
function get(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}
function stats(){const p=get(PROG,{}),h=get(HIST,[]),words=Object.keys(p),known=words.filter(w=>p[w].status==="known").length,attempts=words.reduce((n,w)=>n+(p[w].attempts||0),0),correct=words.reduce((n,w)=>n+(p[w].correct||0),0),challenges=h.length,best=h.length?Math.max(...h.map(x=>x.score)):0,days=new Set(words.filter(w=>p[w].lastReviewed).map(w=>new Date(p[w].lastReviewed).toISOString().slice(0,10))).size;return {words,known,attempts,correct,challenges,best,days,accuracy:attempts?Math.round(correct/attempts*100):0}}
function calculate(){const s=stats(),d=get(DAILY,{}),completedDays=Object.values(d).filter(x=>x.words?.length&&x.completed?.length===x.words.length).length;return s.known*10+s.correct*2+s.challenges*25+s.best+completedDays*15}
const defs=[
["🌱","First Steps","Review your first vocabulary word.",s=>s.words.length>=1,25],
["📚","10 Words Reviewed","Review 10 different words.",s=>s.words.length>=10,50],
["🏆","25 Words Mastered","Mark 25 words as Known.",s=>s.known>=25,100],
["🎯","90% Recall","Reach at least 90% review accuracy.",s=>s.accuracy>=90&&s.attempts>=10,125],
["🔥","Consistency","Review vocabulary on 5 different days.",s=>s.days>=5,100],
["🏁","Challenge Finisher","Complete 3 vocabulary challenges.",s=>s.challenges>=3,100],
["🥇","Challenge 85","Score 85+ in a challenge.",s=>s.best>=85,150],
["🚀","Vocabulary Pro","Master 50 words.",s=>s.known>=50,250],
["🎯","Daily Champion","Complete 7 daily missions.",()=>Object.values(get(DAILY,{})).filter(x=>x.words?.length&&x.completed?.length===x.words.length).length>=7,200]
];
function render(){const s=stats(),x=calculate(),earned=defs.filter(d=>d[3](s)).length;document.getElementById("stats").innerHTML='<div class="stat"><div class="num">'+x+'</div><div class="lab">XP</div></div><div class="stat"><div class="num">'+earned+'/'+defs.length+'</div><div class="lab">Badges</div></div><div class="stat"><div class="num">'+s.known+'</div><div class="lab">Mastered</div></div><div class="stat"><div class="num">'+s.accuracy+'%</div><div class="lab">Recall Accuracy</div></div>';document.getElementById("xp").textContent=x;const next=[25,50,100,200,300,500,750,1000].find(n=>n>x)||1000;document.getElementById("xpfill").style.width=Math.min(100,Math.round(x/next*100))+"%";document.getElementById("next").textContent=x>=1000?"Maximum displayed XP milestone reached.":"Next milestone: "+next+" XP";document.getElementById("badges").innerHTML=defs.map(d=>{const ok=d[3](s);return '<article class="badge '+(ok?"":"locked")+'"><div class="icon">'+d[0]+'</div><h3>'+d[1]+'</h3><p>'+d[2]+'</p><div class="xp">'+(ok?"✓ Earned":"+"+d[4]+" XP")+'</div></article>'}).join("")}
render();
</script></body></html>
