<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expert Sync Vocabulary Hub</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.hero{background:linear-gradient(135deg,#031b3f,#063b91,#0b63ce);color:#fff;padding:30px 18px;text-align:center;border-radius:0 0 28px 28px}.wrap{max-width:900px;margin:auto;padding:16px}.eyebrow{color:#ffd978;font-size:11px;font-weight:800;letter-spacing:2px}.hero h1{margin:8px 0;font-size:29px}.card{background:#fff;border:1px solid #dbe5f2;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 5px 16px rgba(3,27,63,.06)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{padding:15px;border:1px solid #dbe5f2;border-radius:14px}.tile h3{margin:0;color:#063b91}.word{padding:9px 0;border-bottom:1px solid #edf1f6}.small{font-size:11px;color:#68768b}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;background:#063b91;color:#fff}.gold{background:#d4af37;color:#172033}.light{background:#edf4fd;color:#063b91;border:1px solid #cbdced}.row{display:flex;gap:8px;flex-wrap:wrap}.tag{display:inline-block;padding:4px 7px;border-radius:99px;background:#edf4fd;color:#063b91;font-size:9px;font-weight:900}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="hero"><div class="eyebrow">STAGE 36 • EXPERT SYNC ENGLISH ACADEMY</div><h1>🧭 Vocabulary Discovery Hub</h1><p>Your central place to continue learning, revisit recent words and discover new vocabulary.</p></header><main class="wrap"><div class="grid"><div class="tile"><h3>📅 Word of the Day</h3><div id="wotd"></div></div><div class="tile"><h3>🕘 Recent Words</h3><div id="recent"></div></div><div class="tile"><h3>⭐ Saved Words</h3><div id="saved"></div></div></div><div class="card"><h3 style="color:#063b91">Choose your next action</h3><div class="row"><button class="btn gold" onclick="location.href='dictionary-search.html'">🔎 Search</button><button class="btn light" onclick="location.href='vocabulary-wordbook.html'">⭐ My Wordbook</button><button class="btn light" onclick="location.href='vocabulary-daily.html'">🎯 Daily Mission</button><button class="btn light" onclick="location.href='vocabulary-plan.html'">🎓 My Plan</button><button class="btn light" onclick="location.href='vocabulary-profile.html'">👤 Profile</button></div></div></main><script src="vocabulary-schema.js"></script><script>const E=window.ESAVocabularyEntries||[];function get(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function open(w){location.href="dictionary-pro.html?word="+encodeURIComponent(w)}function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}function mini(a){return a.length?a.slice(0,5).map(w=>'<div class="word"><strong>'+esc(w.w)+'</strong><div class="small">'+esc(w.meaning)+'</div><button class="btn light" style="margin-top:5px" onclick="open('+JSON.stringify(w.w)+')">Open</button></div>').join(""):'<div class="small">Nothing here yet.</div>'}const idx=E.length?hash(new Date().toISOString().slice(0,10))%E.length:0;document.getElementById("wotd").innerHTML=E[idx]?'<div class="word"><strong>'+esc(E[idx].w)+'</strong><span class="tag">'+esc(E[idx].level)+'</span><div class="small">'+esc(E[idx].meaning)+'</div><button class="btn gold" style="margin-top:8px" onclick="open('+JSON.stringify(E[idx].w)+')">Learn Word →</button></div>':'<div class="small">No vocabulary loaded.</div>';const recent=get("esaDictionaryRecentV1",[]).map(w=>E.find(x=>x.w===w)).filter(Boolean);const saved=get("esaDictionarySavedV1",[]).map(w=>E.find(x=>x.w===w)).filter(Boolean);document.getElementById("recent").innerHTML=mini(recent);document.getElementById("saved").innerHTML=mini(saved)</script></body></html>
